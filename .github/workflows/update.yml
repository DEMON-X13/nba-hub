name: Update

on:
  schedule:
    # GitHub starts this repo's scheduled runs hours late (3 to 9 hours by the run history of September and October
    # 2026: the 11:00 slot landed between 14:49 and 20:04 UTC, the 21:17 one at 00:17, after the first tip-offs). So
    # each slot is set by when it must land:
    #   07:17  last night's finals and box scores, landing in the morning or early afternoon Eastern
    #   11:17  the day's lines and injury report, landing by mid-afternoon Eastern at the latest
    #   13:17  late lines and injury news, landing before the 7pm Eastern tip-offs (at 9 hours late, 6:17pm EDT and
    #          5:17pm EST: a 5pm or 6pm weekend tip-off can be priced on the 11:17 run instead)
    # A run that does land after a tip-off changes nothing about that game's line or logged number: both are frozen
    # at tip (fetch.js merge, players.js logPredictions). Off the hour: :00 is the minute most often dropped.
    # ESPN's public scoreboard only: no credits. Empty days cost a few requests and commit nothing.
    - cron: "17 7 * * *"
    - cron: "17 11 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "First day to pull (YYYY-MM-DD). Blank = the first day with a game not final (21 days back at most), else the day after the last final"
        type: string
        default: ""
      to:
        description: "Last day to pull (YYYY-MM-DD). Blank = thirty days out"
        type: string
        default: ""
      fit:
        description: "Refit the model's parameters on the fit seasons"
        type: boolean
        default: false
  push:
    # a change to the NBA tools runs them once, so a fix is proven straight away. On a claude/ branch the
    # run commits to that branch; the schedule and the on-demand switch only work from main.
    branches: [main, "claude/**"]
    paths: ["tools/*.js", "app/*.html", "app/parts/*.html"]

permissions:
  contents: write

concurrency:
  # one queue per branch: a claude/ branch's run never takes the place of a pending scheduled run on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # the branch head, not the pushed commit: a run queued behind another must see what that one committed
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The pull is the one step the rest needs. After it, each step may fail on its own and the run goes on: whatever
      # the pull, the box scores and the models wrote (finals, pre-tip lines, the numbers logged before tip-off, which
      # the record grades) is committed all the same, and the run is red at the end.
      - name: Pull results and the coming slate from ESPN
        id: fetch
        run: node tools/fetch.js ${{ inputs.from && format('--from {0}', inputs.from) || '' }} ${{ inputs.to && format('--to {0}', inputs.to) || '' }}
      # X's finished parlays clear themselves (README "X Parlays"): a parlay whose every game is final in this run's
      # games.csv (or, on no list at all, two days past its date, as the page voids it) is marked "cleared" in
      # liveparlays/parlays.json two Eastern days after its last game, so X Parlays shows it on its game day and the next.
      # Its test runs first; a failure marks this step alone and puts the file back as committed
      - name: Clear X's finished parlays
        id: autoclear
        continue-on-error: true
        run: |
          if node tools/test_autoclear.js && node tools/autoclear.js; then exit 0; fi
          git checkout HEAD -- liveparlays/parlays.json
          exit 1
      - name: Pull box scores, the injury report and the coaches
        id: box
        continue-on-error: true
        run: node tools/fetch_box.js --budget 25
      - name: Replay the ratings and price the slate
        id: elo
        continue-on-error: true
        run: node tools/elo.js ${{ inputs.fit && 'fit' || '' }}
      - name: Replay the player, coach and matchup model
        id: players
        continue-on-error: true
        run: node tools/players.js ${{ inputs.fit && 'fit' || '' }}
      # The game models ported from the NFL hub (README "The Alpha Model", "The Joker", "The ELO Model"): each calls the
      # season in play and the games to come into models/<id>.json, then its test holds the file. A model that cannot run
      # keeps its last calls and says why (status ok false, exit 1, the step red); a test that fails puts the file back as
      # committed. Either way the run goes on
      - name: The Alpha Model
        id: alpha
        continue-on-error: true
        run: |
          m=0; node tools/alpha.js || m=$?          # the step's shell stops at a failed command: keep its code
          if ! node tools/test_alpha.js; then
            echo "::error::the Alpha Model's test failed: models/alpha.json is put back"
            if git cat-file -e HEAD:models/alpha.json 2>/dev/null; then git checkout HEAD -- models/alpha.json; else rm -f models/alpha.json; fi
            exit 1
          fi
          exit $m
      - name: The Joker
        id: joker
        continue-on-error: true
        run: |
          m=0; node tools/joker.js || m=$?
          if ! node tools/test_gbm.js > /tmp/test_gbm.log 2>&1 || ! node tools/test_joker.js; then
            tail -20 /tmp/test_gbm.log
            echo "::error::the Joker's tests failed: models/joker.json is put back"
            if git cat-file -e HEAD:models/joker.json 2>/dev/null; then git checkout HEAD -- models/joker.json; else rm -f models/joker.json; fi
            exit 1
          fi
          exit $m
      - name: The ELO Model
        id: elo_model
        continue-on-error: true
        run: |
          m=0; node tools/elo_model.js || m=$?
          if ! node tools/test_elo_model.js; then
            echo "::error::the ELO Model's test failed: models/elo.json is put back"
            if git cat-file -e HEAD:models/elo.json 2>/dev/null; then git checkout HEAD -- models/elo.json; else rm -f models/elo.json; fi
            exit 1
          fi
          exit $m
      # The calls ledger (README "Pick'em Record"): each model's call on each game, published before tip-off and frozen
      # from it, in data/calls.json, which the Pick'em Record grades; its check holds it to the last commit (no frozen call
      # moved or dropped, none logged after tip-off), and a failure puts the file back as committed
      - name: The calls ledger
        id: calls
        continue-on-error: true
        run: |
          if node tools/calls.js && node tools/calls_check.js; then exit 0; fi
          echo "::error::the calls ledger failed its check: data/calls.json is put back"
          if git cat-file -e HEAD:data/calls.json 2>/dev/null; then git checkout HEAD -- data/calls.json; else rm -f data/calls.json; fi
          exit 1
      # The props model (README "Player props"): DraftKings' closing player lines for the finals not read yet (one free
      # ESPN request a game, into data/props_<season>.csv), the projections for the games to come (props.json) and the
      # shadow ledger (data/props_shadow.json and its graded lines, data/props_shadow_lines.csv), then the ledger's check
      # against the last commit. When either fails, every props data file and props.json go back to the last commit's (a
      # file new since then is removed), so a broken ledger or record is never committed and the page never publishes
      # projections the ledger did not freeze, and the run is red
      - name: The props model, DraftKings' closing lines and the shadow ledger
        id: props
        continue-on-error: true
        run: |
          restore() {
            for f in props.json data/props_shadow.json data/props_shadow_lines.csv data/props_reads.json data/props_2*.csv; do
              [ -e "$f" ] || continue
              if git cat-file -e "HEAD:$f" 2>/dev/null; then git checkout HEAD -- "$f"; else rm -f "$f"; fi
            done
          }
          if ! node tools/props.js; then echo "::error::the props step failed: its data files are put back"; restore; exit 1; fi
          if ! node tools/props_check.js; then echo "::error::the props ledger's check failed: its data files are put back"; restore; exit 1; fi
      # DraftKings' lines on the next two nights' games, read from ESPN's free feed (README "The lines feed"): the game
      # lines with their prices and ids and each game's player props, into lines.json, which the Parlay Builder and
      # Suggested Parlays read (its test is in the tests below). A half that fails for every game keeps its last good reads
      # and marks this step alone; nothing answering at all leaves lines.json as committed
      - name: Read DraftKings' lines for the next two nights
        id: lines
        continue-on-error: true
        run: node tools/lines.js
      - name: Publish the state and build the pages
        id: publish
        continue-on-error: true
        run: node tools/publish.js && node tools/build.js
      # The tests gate what visitors see, state.json and the pages, and never the data: a failed test (or npm registry)
      # must not throw away the day's finals, lines, box scores and pre-tip numbers.
      - name: Tests (the pull's bookkeeping, the box scores, the props model, the same-game table, the lines feed, the calls ledger, then the viewer on the new state)
        id: tests
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: |
          (cd tools && npm ci)
          node tools/test_fetch.js
          node tools/test_fetch_box.js
          node tools/test_props.js
          node tools/test_corr.js
          node tools/test_lines.js
          node tools/test_calls.js
          node tools/smoke.js
      - name: Commit if anything changed
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "nba-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add data models model.json players.json props.json liveparlays/parlays.json
          if [ -e lines.json ]; then git add lines.json; fi    # absent until the lines feed's first read: a missing path would stop git add
          if [ "${{ steps.publish.outcome }}" = "success" ] && [ "${{ steps.tests.outcome }}" = "success" ]; then git add state.json history.json pickem.json index.html admin.html
          else echo "::warning::publishing or the tests failed: the data is committed, state.json, history.json and the pages are left as they were"; for f in state.json history.json pickem.json index.html admin.html; do if git cat-file -e "HEAD:$f" 2>/dev/null; then git checkout HEAD -- "$f"; else rm -f "$f"; fi; done; fi
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "update $(date -u +'%Y-%m-%d %H:%M UTC')"
            ok=0
            # liveparlays/parlays.json is kept by hand as well as cleared by this job: when a hand edit landed on main during
            # the run and the rebase stops on that file alone, main's copy is kept and this run's clearing dropped (the next
            # run clears it again from games.csv), so the run's data is never lost to it
            for i in 1 2 3; do
              if ! git pull --rebase; then
                if [ "$(git diff --name-only --diff-filter=U)" = "liveparlays/parlays.json" ] && git checkout --ours -- liveparlays/parlays.json && git add liveparlays/parlays.json && GIT_EDITOR=true git rebase --continue; then
                  echo "liveparlays/parlays.json changed on main during the run: main's copy kept, this run's clearing left to the next"
                else
                  git rebase --abort 2>/dev/null || true      # a stopped rebase would make every retry fail at once
                  echo "push raced another job, retrying ($i)"; sleep 15; continue
                fi
              fi
              if git push; then ok=1; break; fi
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
      - name: Fail the run when a step failed
        if: always() && (steps.fetch.outcome != 'success' || steps.autoclear.outcome != 'success' || steps.lines.outcome != 'success' || steps.box.outcome != 'success' || steps.elo.outcome != 'success' || steps.players.outcome != 'success' || steps.alpha.outcome != 'success' || steps.joker.outcome != 'success' || steps.elo_model.outcome != 'success' || steps.calls.outcome != 'success' || steps.props.outcome != 'success' || steps.publish.outcome != 'success' || steps.tests.outcome != 'success')
        run: |
          echo "::error::failed: pull ${{ steps.fetch.outcome }}, autoclear ${{ steps.autoclear.outcome }}, lines ${{ steps.lines.outcome }}, box ${{ steps.box.outcome }}, elo ${{ steps.elo.outcome }}, players ${{ steps.players.outcome }}, alpha ${{ steps.alpha.outcome }}, Joker ${{ steps.joker.outcome }}, ELO Model ${{ steps.elo_model.outcome }}, calls ${{ steps.calls.outcome }}, props ${{ steps.props.outcome }}, publish ${{ steps.publish.outcome }}, tests ${{ steps.tests.outcome }}"
          exit 1
