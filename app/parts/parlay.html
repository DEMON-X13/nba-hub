<script>
'use strict';
/* ---------- the Parlay Builder (README "Parlay Builder") ----------
   The NFL hub's Parlay Builder tab (props/build/part3.js there, app v114), on this hub's lines: its choices at the top
   (the Bet amount, Refresh odds, a mix, five bet types and the games), the Top 50 lines they make, Value picks first,
   and the builder under them, which prices whatever legs the visitor puts in it. Exactly as the NFL's, adapted only
   where basketball or the NBA's data forces it, each adaptation said where it is made:
   - the games are every game still to tip on the lines feed's two Eastern dates (lines.json, tools/lines.js: the NBA has
     no weeks), listed under their day, never a preseason game;
   - the prices are DraftKings', read by the job into lines.json (read here, no-store, when the tab first opens) or by a
     Refresh odds press (memory only), the newer of the two; every one a real price, so nothing is estimated;
   - the chances: a moneyline's the player model's win chance; a spread's the player model's margin against the line,
     spread SIGMA points (measured, tools/sigma.js); a total's the market's own; a player's the props model's, on trial,
     marked so wherever it shows (the owner's call of 25 October 2026), never for a player it does not project or the
     injury report has out, and none at all once its shadow ledger has failed its bar;
   - the fair chance is the NBA's measured rule (legFair: a main line's whole margin on the Over), the confidence the
     NBA's band, the same-game price the NBA's exact and GHK copula with the NFL hub's hold (slipDec, sgJoint);
   - the Value rule is the 3-point edge alone (the NBA has no market + form), and the DraftKings id rule binds game legs
     only (ESPN's feed carries no id for a player's line, so a player's leg goes on DraftKings' slip by hand);
   - the builder's legs are the visitor's own parlay (M.slip.legs), which a game's Player props adds to as well, and a
     second leg of a game is taken or refused by the NBA's same-game rules (slipWhy), each refusal said.
   Nothing here writes anything but the visitor's own choices, Bet amount and legs, in the page's one key. */
const PB_TOP_N = 50, PB_DAYS = 2;
const PB_EDGE = 0.03, PB_PMIN = 0.45, PB_PMAX = 0.97, PB_FAR = 0.15;
const PB_CAP = 40, PB_BEAM = 12, PB_WIDE = 24, PB_LIKELY = 3, PB_FINAL = 8;
const PB_KINDS = [['ml', 'Moneyline', 'straight up'], ['ats', 'Spread', 'to cover'], ['total', 'Game total', 'over/under'], ['over', 'Player overs', ''], ['under', 'Player unders', '']];
const PB_MIXES = [['all', 'All', ['ml', 'ats', 'total', 'over', 'under']], ['teams', 'Teams only', ['ml', 'ats', 'total']], ['players', 'Players only', ['over', 'under']]];
const PB_TIERS = [['safe', 'Safe', 2, 0], ['med', 'Medium', 3, 0.25], ['aggr', 'Aggressive', 4, 0.12], ['xtrm', 'Extreme', 5, 0.05]];
const PB_SEARCH = { cap: PB_CAP, beam: PB_BEAM, wide: PB_WIDE, likely: PB_LIKELY, final: PB_FINAL };
const pbOpt = o => o ? { ...PB_SEARCH, ...o } : PB_SEARCH;
let PB_CACHE = new Map(), PB_TOP_CACHE = new Map(), PB_SHOWN = null, PB_AMT_T = null, PB_SAID = null;
/* every leg the panel has drawn, by its key (slipKey), so its Add finds the leg as it was drawn; outside M, never saved */
const PB_LEGS = new Map();

/* ---------- lines.json: DraftKings' lines as the job read them ----------
   Read once a page load, no-store, the first time the Parlay Builder or Suggested Parlays opens (never on load, never on
   a timer); kept in memory, never stored. A file that does not answer, or is not version 1 with its games, is no file: the
   list then has only what a Refresh odds press reads, and says so. Each half of a game is its own read (README "The lines
   feed"), and a press's read of a half, being newer, takes its place (pbGl, pbPr). The one read is one promise, which a
   second caller (the other tab, the suggestions record's job) waits on; the tab in view is drawn again when it answers */
let LINES = null, LINES_ERR = false, LINES_ASKED = false, LINES_P = null;
function pbLinesLoad() {
  if (LINES_P) return LINES_P; LINES_ASKED = true;
  return (LINES_P = (async () => {
    let j = null;
    try { const r = await fetch('lines.json', { cache: 'no-store' }); if (r && r.ok) j = await r.json(); } catch (e) { j = null; }
    if (j && typeof j === 'object' && j.v === 1 && j.games && typeof j.games === 'object' && !Array.isArray(j.games)) LINES = j; else LINES_ERR = true;
    PB_TOP_CACHE.clear(); PB_CACHE.clear();
    if (tabNow() === 'parlay') pbKeep(() => render.parlay()); else if (tabNow() === 'suggest' && render.suggest) render.suggest(); else pbOddsSync();
  })());
}
/* tools/lines_feed.js linesGl, line for line: a lines.json entry -> the shape oddsGameLines gives (what the page keeps
   for a press in SG_LINES), or null where the entry has no line */
function linesGl(x) {
  if (!x || !(x.ml || x.spread || x.total)) return null;
  const id = (k, s) => (x.ids && x.ids[k] && x.ids[k][s]) || null;
  const out = { event: (x.ids && x.ids.event) || null };

  const fairAm = pr.corr != null && pr.corr > 0 && pr.corr < 1 ? fmtAm(probToAm(pr.corr)) : '–';
  let html = `<div class="pb-card pb-builder"><h2 id="pbTitle" tabindex="-1" style="display:flex;align-items:center;gap:10px">${n}-leg parlay <span class="pb-pill">building</span></h2>${espnCtl('builder')}
    <p class="pb-lead">Every leg has to land. The chance below is worked out with the legs' real relationship to each other, not by multiplying them together.</p>
    <table class="pb-btbl"><thead><tr><th>Player</th><th>The bet</th><th class="num">Projected</th><th class="num">Chance</th><th class="num">Price</th><th><span class="sr">Remove</span></th></tr></thead><tbody>`;
  legs.forEach((l, i) => {
    const f = legFair(l), far = f && l.p != null && l.p - f.p >= PB_FAR - 1e-9, [c, lbl] = l.p != null ? pbBandOf(l.p) : ['', ''];
    html += `<tr class="legrow" data-pb-row="${esc(l.sk)}"><td class="plr">${glanceName(l, { ml: l.odds, src: 'real' })}${pbInj(l)}<small>${esc(l.pos)} · ${esc(l.team)} v ${esc(l.opp)} · ${esc(pbDayText(l.date))}</small></td>
      <td class="bet"><b>${esc(l.label)}</b>${far ? `<small class="faroff" data-far>${farText(l.p, f)}</small>` : ''}${dkSlipLine(slips && slips[i], i)}</td>
      <td class="num" data-h="Projected">${pbNum(l.mu)}</td>
      <td class="num" data-h="Chance">${l.p != null ? `<span data-pb-p="${l.p}">${pbPct(l.p)}</span><span class="pb-conf ${c}">${lbl}</span>${pbTrialMark(l)}` : '<span class="pb-q">no model chance</span>'}${f ? `<small class="legfair" data-legfair="${f.p}" title="DraftKings' fair chance on this leg: its price with the margin taken out${f.est ? ', estimated since only this side is priced' : ''}">fair ${pbPct(f.p)}${f.est ? ' est.' : ''}</small>` : ''}</td>
      <td class="num pb-px" data-h="Price">${fmtAm(l.odds)} <small title="DraftKings' price, read ${esc(oddsClock(l.at))}">real · read ${esc(oddsClock(l.at))}</small></td>
      <td class="rm"><button type="button" class="btn ghost" data-drop="${esc(l.sk)}" aria-label="Remove ${esc(l.name)}, ${esc(l.label)}, from the builder">Remove</button></td></tr>`;
  });
  html += `</tbody></table>`;
  { const out = legs.filter(l => l.kind === 'prop' && (() => { const g = S.slate.find(x => x.id === l.id); return g && ppOut(g, l.pid); })());
    if (out.length) html += `<p class="pb-warn" data-pb-out>${out.map(l => esc(l.name)).join(', ')} ${out.length === 1 ? 'is' : 'are'} on the injury report (${out.map(l => esc(ppOut(S.slate.find(x => x.id === l.id), l.pid))).join('; ')}). A book voids a leg on a player who does not play and pays the rest at their own prices; take ${out.length === 1 ? 'it' : 'them'} off to see what the rest pay.</p>`; }
  html += `<div class="pb-pays"><h3>What it pays</h3>
    <div class="pb-paybar">
      <label>Your stake $<input type="number" id="pStake" inputmode="decimal" min="${STAKE_MIN}" max="${STAKE_MAX}" step="1" value="${stakeText(stake)}"></label>
      ${stakeChips()}
      <label>Your book's parlay price <input type="number" id="pBook" step="5" placeholder="${fmtAm(decToAm(P.dec))}" value="${M.bookPrice != null ? esc(M.bookPrice) : ''}"></label>
      <span class="pb-hint">${sg ? 'Blank prices the legs that share a game together, the way a book does.' : 'Blank multiplies DraftKings’ leg prices.'}</span>
    </div>
    <div class="pb-bigp">
      ${fair && fair.p != null ? `<div class="pb-box hero"><b data-fair="${fair.p}">${(fair.p * 100).toFixed(1)}%</b><span>fair chance all ${n} land${fair.est ? ', est.' : ''}</span>${pr.corr != null ? `<small data-model="${pr.corr}">model says ${(pr.corr * 100).toFixed(1)}%${trial ? ', on trial' : ''}</small>` : '<small>no model chance: a player in it is not projected</small>'}</div>`
        : pr.corr != null ? `<div class="pb-box hero"><b data-model="${pr.corr}">${(pr.corr * 100).toFixed(1)}%</b><span>model's chance all ${n} land${trial ? ', on trial' : ''}</span><small>no fair chance: a leg has one price only</small></div>`
        : `<div class="pb-box hero"><b>–</b><span>no chance to show</span><small>a leg has neither a fair chance nor a model chance</small></div>`}
      <div class="pb-box"><b>${fairAm}</b><span>fair price for the model's chance</span></div>
      <div class="pb-box"><b class="payout" data-payout="${payout}">${pbMoney(payout)}</b><span>returned if it lands, ${pbMoney(profit)} profit${override ? ', at your price' : sg ? ', est.' : ''}</span></div>
      ${(() => { const on = fair && fair.p != null, cp = on ? fair.p : pr.corr; if (cp == null) return '';
        const [c, l] = pbBandOf(cp); return `<div class="pb-box tier ${c}" data-conf="${cp}"><b>${l}</b><span>confidence all ${n} land, on the ${on ? 'fair' : 'model’s'} chance</span></div>`; })()}
    </div>
    <p class="pb-fair-note">${fair && fair.p != null ? `The fair chance is DraftKings’: its prices with the margin taken out (a main line’s whole margin on the Over, as measured on DraftKings’ archived lines)${fair.est ? ', est. where a leg is priced on one side only or the legs share a game' : ''}, the legs moving together as the model’s do.`
      : `The fair chance needs both of DraftKings’ prices on every leg; ${fair && fair.miss === 1 ? 'one leg has' : (fair ? fair.miss : 0) + ' legs have'} one only, so this is the model’s chance alone.`}</p>
    ${sg && override == null ? `<p class="pb-fair-note" data-sl-why>Legs here share a game, so they are priced together rather than multiplied: multiplying them would say <b>${pbMoney(stake * P.prod)}</b>, which is what a book pays only when the legs are in different games. ${SG_WHY}, with the NFL hub’s same-game hold (${S.corr && S.corr.hold}), untested on the NBA; type your book’s own parlay price above to override it.</p>` : ''}
    <div class="pb-acts"><button type="button" class="btn hot" id="pFinish" title="Opens this parlay as a card to place at DraftKings or share. Nothing is saved: not here, not in X’s parlays.">Finish parlay</button><button type="button" class="btn ghost" id="pClear">Clear ALL</button></div></div></div>`;
  if (pr.pairs.length) {
    html += `<div class="pb-card pb-move"><h2>Legs that move together</h2>
      <table class="pb-btbl"><thead><tr><th>Pair</th><th class="num">Strength</th><th>What it means</th></tr></thead><tbody>` +
      [...pr.pairs].sort((a, b) => Math.abs(b.rho) - Math.abs(a.rho)).map(x => { const A = legs[x.i], B = legs[x.j];
        return `<tr><td>${esc(A.name)} ${esc(A.label)}<br>${esc(B.name)} ${esc(B.label)}</td><td class="num">${x.rho > 0 ? '+' : ''}${x.rho.toFixed(2)}</td><td class="${x.rho > 0 ? 'up' : 'down'}">${x.rho > 0 ? 'tend to happen in the same game' : 'tend to happen at each other’s expense'}</td></tr>`; }).join('')
      + `</tbody></table><p class="pb-fair-note">Measured on the hub’s own box scores, 2022-23 to 2025-26 (data/corr.json). A player’s points and his threes are much the same night described twice: legs that move together land together more often than their chances multiplied say.</p></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('[data-drop]').forEach(b => b.addEventListener('click', () => {
    M.slip.legs = M.slip.legs.filter(x => slipKey(x) !== b.dataset.drop); SLIP_SAID = []; PB_SAID = null; saveMine(); renderParlay(); const t = $('#pbTitle'); if (t) t.focus(); }));
  $('#pStake').addEventListener('input', e => { const v = stakeRead(e.target.value); if (v == null) return;
    M.stake = v; saveMine(); const b = $('#pbStake'); if (b) b.value = stakeText(v); pbPays(); });
  $('#pStake').addEventListener('change', e => { const v = stakeRead(e.target.value); if (v != null) M.stake = v; M.stake = pbStake(); saveMine(); pbKeep(() => renderParlay()); });
  el.querySelectorAll('[data-stake-chip]').forEach(b => b.addEventListener('click', () => { M.stake = +b.dataset.stakeChip; saveMine(); pbKeep(() => renderParlay()); }));
  $('#pBook').addEventListener('change', e => { const v = parseFloat(e.target.value); M.bookPrice = isFinite(v) && v !== 0 && Math.abs(v) >= 100 ? v : null; saveMine(); pbKeep(() => renderParlay()); });
  $('#pFinish').addEventListener('click', e => { if (pbStale()) { pbKeep(() => render.parlay()); return; } if (window.PARLAY_CARD) window.PARLAY_CARD.openBuilder(e.currentTarget); });
  $('#pClear').addEventListener('click', () => { if (!confirm('Remove every leg from the builder?')) return;
    M.slip.legs = []; M.bookPrice = null; SLIP_SAID = []; PB_SAID = null; saveMine(); renderParlay(); const t = $('#pbTitle'); if (t) t.focus(); });
}
/* the tab: the panel over the builder, and nothing else */
render.parlay = function () {
  const el = $('#tab-parlay');
  if (!el.dataset.ready) { el.innerHTML = '<div id="pbPanel"></div><div id="parlayBody"></div>'; el.dataset.ready = 1; }
  pbLinesLoad(); pbWatch();
  renderParlay();
};
/* what Suggested Parlays, the checks and the next pieces stand on */
Object.assign(window, { pbGames, pbDates, pbListed, pbUi, pbClean, pbMix, pbKind, pbAllows, pbHeldWhy, pbWho, pbPriced, pbTotals, pbLegs, pbPool, pbCap, pbFits, pbMaxLegs, pbBestReturn, pbLikeliest, pbTierOn, pbTierOf, pbTier,
  PB_TIERS, PB_KINDS, PB_MIXES, PB_TOP_N, PB_SEARCH, getPbTiers, getPbTop, pbTopBuild, pbTierCard, pbValMark, pbIsValue, pbTrialMark, pbOrder, pbOrd, parlayProb, parlayDec, parlayFair, legFair, legFarOff, legModel,
  pbView, pbSlipOf, pbLegAddBtn, pbPut, pbStale, pbWatchTick, stakeRead, pbStake, renderParlay, renderPb, pbLinesLoad, linesGl, pbGl, pbPr, pbCarries, pbQuote, dkSlipRows, dkSlipLine, glanceName,
  toggleLeg: l => slipToggle(pbSlipOf(l)), pbLines: () => LINES });
</script>
