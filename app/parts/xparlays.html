<section id="tab-xparlays" hidden>
  <div id="lpCard">
    <h2>X Parlays</h2>
    <p class="lp-upd" id="lpUpdated"></p>
    <div class="lp-ctl">
      <span class="lp-stamp"><span class="lp-dot" id="lpDot"></span><span id="lpStamp" role="status" aria-live="polite">idle</span></span>
      <span class="lp-grow"></span>
      <button type="button" class="btn" id="lpNow">Refresh now</button>
    </div>
    <div id="lpApp"></div>
    <div class="lp-dlg" id="lpAsk" hidden>
      <div class="lp-dlg-panel" role="alertdialog" aria-modal="true" aria-labelledby="lpAskTitle" aria-describedby="lpAskWhat lpAskText">
        <h3 id="lpAskTitle">Clear this parlay?</h3>
        <p class="lp-dlg-what" id="lpAskWhat"></p>
        <p class="lp-dlg-text" id="lpAskText">It is cleared from X Parlays on this device only, and nothing is sent anywhere; you can show it again at the foot of the list. X’s parlays clear themselves for everyone the day after their last game.</p>
        <div class="lp-dlg-btns"><button type="button" class="btn" id="lpAskNo">Cancel</button><button type="button" class="btn lp-danger" id="lpAskYes">Clear</button></div>
      </div>
    </div><!-- /lpAsk -->
  </div>
</section>
<style>

#lpCard .lp-x{position:absolute;top:3px;right:3px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease)}

#lpCard .lp-games{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
/* green while the parlay is winning this game, red once it is losing it, gold while it is level or undecided: the
   legs' own three colours, on the scoreboard */
#lpCard .lp-gm{display:inline-block;background:var(--bg-2);border:1.5px solid var(--line-2);border-radius:999px;padding:4px 11px;font-family:var(--display);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}

@media(max-width:430px){#lpCard .lp-gm{font-size:12px;padding:3px 9px} #lpCard .lp-p{padding:12px 12px 6px}}

#lpCard .lp-knob{position:absolute;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--gold);border-radius:999px;padding:1px 9px;font-family:var(--display);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}

/* Clear this parlay?: a small window over the page (Escape, Cancel or a click outside close it, Tab stays inside, the
   focus goes back to the X). It scrolls, so a phone on its side or large text never puts Clear out of reach; the panel's
   auto margins centre it while it fits and let it start at the top once it does not */
#lpCard .lp-dlg{position:fixed;inset:0;z-index:30;background:rgba(14,17,27,.66);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
#lpCard .lp-dlg-panel{background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 30px 80px -30px rgba(0,0,0,.8);width:100%;max-width:420px;margin:auto;padding:20px 20px 18px}
#lpCard .lp-dlg-panel h3{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.2;margin:0 0 8px;color:var(--ink)}

#lpCard .lp-dlg-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
#lpCard .lp-dlg-btns .btn{min-height:44px;min-width:104px}
</style>
<script>
/* ---------- X Parlays ----------
   X's placed parlays, the same on every device and read only everywhere: the parlays X placed at the book, in the
   repository's liveparlays/parlays.json, which Claude keeps from the slips the owner sends in chat (README "X Parlays").
   The page reads the file, and ESPN's scoreboard and box scores for the parlays' games, when this tab is first shown in
   a page load (a page that opens on it from the saved tab too) and on Refresh now: never on load before that, never on
   a timer, never on focus or visibility. Every read is cache no-store. A parlay the file marks "cleared" stays there as
   history and is not drawn, nor are its games read.

   A leg is graded by the page's own settlement wherever the published state has its game's final (legResult for a team
   leg, propGrade on the published box lines for a player's), so X Parlays and the Bet Build never disagree; ESPN's
   live answers carry a leg while its game is on, or final and not published yet. A game ESPN calls postponed or
   canceled, or one the published state says was not played on its date, voids every leg on it; a player who did not
   take the floor voids his leg once the game is final, as DraftKings settles it.

   Every card has an X at its top right, the same for every visitor: it asks "Clear this parlay?" and, on Clear, takes
   that parlay off X Parlays on this device alone. That is the visitor's own choice of what to see here, never X's data:
   it is kept in this browser's storage under nba_lp_cleared_v1 (the parlay ids, each with when it was cleared), never
   sent anywhere, and never under the NFL hub's lp_cleared_here_v1: the two hubs are one origin and share a browser's
   storage, so each prunes only its own list. The list is pruned of any id the file no longer has or has cleared itself.

   This script runs before the page's own (it sits in the page where its section does), so it reads the page's state
   and helpers (S, gameById, legResult, propGrade, boxOf, propValue) only when it draws or reads, long after both have
   loaded; the page calls window.lpShow() from its tab code and window.lpLeave() on every tab change. */
(function () {
'use strict';
const DATA = 'liveparlays/parlays.json';
const SB = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?limit=100&dates=';
const SUM = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=';
/* ESPN's codes where they differ from the site's (tools/lib.js ESPN_AB) */
const AB = { GS: 'GSW', NO: 'NOP', NY: 'NYK', SA: 'SAS', UTAH: 'UTA', WSH: 'WAS' };
const ab = c => { const u = String(c || '').toUpperCase(); return AB[u] || u; };
const HERE_KEY = 'nba_lp_cleared_v1';
const STATS = ['pts', 'reb', 'ast', 'tpm', 'stl', 'blk', 'pra', 'pr', 'pa', 'ar', 'sb', 'dd', 'td', 'ml', 'spread', 'total'];
const PARTS = { pts: ['pts'], reb: ['reb'], ast: ['ast'], tpm: ['tpm'], stl: ['stl'], blk: ['blk'], pra: ['pts', 'reb', 'ast'], pr: ['pts', 'reb'], pa: ['pts', 'ast'], ar: ['ast', 'reb'], sb: ['stl', 'blk'], dd: ['pts', 'reb', 'ast', 'stl', 'blk'], td: ['pts', 'reb', 'ast', 'stl', 'blk'] };
const LINE = ['pts', 'reb', 'ast', 'tpm', 'stl', 'blk'];                 // the box line's order, S.boxes.line's
const SHORT = { pts: 'pts', reb: 'reb', ast: 'ast', tpm: '3PM', stl: 'stl', blk: 'blk' };
const STAT_NAME = { pts: 'Points', reb: 'Rebounds', ast: 'Assists', tpm: 'Threes', stl: 'Steals', blk: 'Blocks', pra: 'Pts + reb + ast', pr: 'Pts + reb', pa: 'Pts + ast', ar: 'Ast + reb', sb: 'Stl + blk', dd: 'Double-double', td: 'Triple-double', ml: 'To Win', spread: 'To Cover', total: 'Total Points' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (x, d) => x == null || !Number.isFinite(+x) ? '–' : (+x).toFixed(d);
const n1 = x => num(x, Math.abs(+x % 1) > 1e-9 ? 1 : 0);
const fmtML = ml => ml == null ? '–' : (ml > 0 ? '+' + ml : '' + ml);
const money = x => x != null && x !== '' && Number.isFinite(+x) ? +x : null;
const isGameLeg = l => l.stat === 'ml' || l.stat === 'spread' || l.stat === 'total';
const isYes = l => l.stat === 'dd' || l.stat === 'td';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const espnNum = s => { if (s == null || s === '') return null; const v = parseFloat(String(s).replace(/,/g, '')); return Number.isFinite(v) ? v : null; };
const etDate = ms => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms));
const dayLong = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', timeZone: 'UTC' });
const dayShort = d => { const x = new Date(d + 'T12:00:00Z'), o = { timeZone: 'UTC' };
  return `${x.toLocaleDateString('en-US', { ...o, weekday: 'short' })} ${x.toLocaleDateString('en-US', { ...o, month: 'short' })} ${x.getUTCDate()}`; };
const monDay = d => { const x = new Date(d + 'T12:00:00Z'); return `${x.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' })} ${x.getUTCDate()}`; };
const localT = k => new Date(k).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
/* a name both sources can agree on: no case, accents, punctuation or suffix (the NFL hub's normName); and last name
   plus first initial, for a box that spells him another way */
const normName = n => String(n || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[.'’]/g, '').replace(/-/g, ' ')
  .replace(/\b(jr|sr|ii|iii|iv)\b/g, '').replace(/\s+/g, ' ').trim();
const nameKey = n => { const p = normName(n).split(' ').filter(Boolean); return p.length ? p[p.length - 1] + '|' + p[0][0] : ''; };

/* a game id carries its season, its Eastern date and its clubs: 2027_20261024_BKN_CLE is the 2026-27 season, 24 October,
   Brooklyn at Cleveland, as data/games.csv writes it */
function gidParts(gid) {
  const m = /^(\d{4})_(\d{4})(\d{2})(\d{2})_([A-Z]{2,3})_([A-Z]{2,3})$/.exec(String(gid || ''));
  return m ? { id: String(gid), season: +m[1], date: `${m[2]}-${m[3]}-${m[4]}`, ymd: m[2] + m[3] + m[4], a: m[5], h: m[6] } : null;
}
/* the file's own shape: games listed once, legs pointing at them by their place in that list. A cleared parlay is left
   out here, before anything reads its games; a leg on no game, an unknown stat or no line is dropped, and a parlay with
   no leg left */
function readLeg(q, games) {
  if (!q || typeof q !== 'object') return null;
  const gid = Number.isInteger(q.game) && q.game >= 0 && q.game < games.length ? String(games[q.game] || '') : '', gp = gidParts(gid);
  let stat = String(q.stat || '').toLowerCase(); if (stat === 'ats') stat = 'spread';
  const k = q.line != null && q.line !== '' ? +q.line : NaN;
  if (!gp || !STATS.includes(stat) || !Number.isFinite(k)) return null;
  return { gid, date: gp.date, stat, k, side: q.side === 'under' ? 'under' : 'over', main: !!q.main, name: String(q.player || ''), team: ab(q.team), pid: q.pid != null && q.pid !== '' ? String(q.pid) : '' };
}
function readFile(v) {
  if (!v || typeof v !== 'object') return [];
  const games = Array.isArray(v.games) ? v.games : [], rows = Array.isArray(v.parlays) ? v.parlays : [];
  return rows.map((o, ix) => {
    if (!o || typeof o !== 'object' || o.cleared === true) return null;
    const legs = (Array.isArray(o.legs) ? o.legs : []).map(q => readLeg(q, games)).filter(Boolean);
    if (!legs.length) return null;
    const date = typeof o.date === 'string' && /^\d{4}-\d\d-\d\d$/.test(o.date) ? o.date : legs.map(l => l.date).sort()[0];
    return { id: String(o.id || ('p' + ix)), date, stake: +o.stake || 0, price: money(o.price), payout: +o.payout || 0, note: o.note ? String(o.note) : '', legs };
  }).filter(Boolean);
}
const updatedOf = v => { const t = v && typeof v.updated === 'string' ? Date.parse(v.updated) : NaN; return Number.isFinite(t) ? t : null; };

/* ---- the parlays this device has cleared: this browser's own list, under one key of its own ----
   [{id, at}], the parlay's id in the file and when it was cleared here. Storage is shared by every tab of the site (and
   by the NFL hub, one origin), so each change starts from what it holds now, never from this tab's copy; where storage
   refuses (a private window, blocked site data) the list in memory is the list for the visit, and the page still draws */
function hereLoad() {
  let raw; try { raw = localStorage.getItem(HERE_KEY); } catch (e) { return null; }
  let v = null; try { v = JSON.parse(raw || 'null'); } catch (e) { v = null; }
  const seen = new Set();
  return (Array.isArray(v) ? v : []).filter(x => x && typeof x.id === 'string' && x.id && !seen.has(x.id) && seen.add(x.id)).map(x => ({ id: x.id, at: typeof x.at === 'string' ? x.at : null }));
}
let hereMem = false;
function hereNow() {
  if (hereMem) return STATE.here.slice();
  const v = hereLoad(); if (v === null) { hereMem = true; return STATE.here.slice(); }
  return v;
}
/* written only where it differs, removed when empty, so a browser that never cleared anything never has the key */
function hereWrite(list) {
  STATE.here = list;
  if (hereMem) return;
  try {
    const want = list.length ? JSON.stringify(list) : null;
    if (localStorage.getItem(HERE_KEY) === want) return;
    if (want === null) localStorage.removeItem(HERE_KEY); else localStorage.setItem(HERE_KEY, want);
  } catch (e) { hereMem = true; }
}
const STATE = { parlays: [], updated: null, games: {}, box: {}, err: null, dataErr: null, at: 0, busy: false, settled: {}, loaded: false, shown: false, here: [], again: false };
STATE.here = hereNow();
const isHere = id => STATE.here.some(x => x.id === id);
const shown = () => STATE.parlays.filter(p => !isHere(p.id));

/* ---- the published state, the page's own reading of it ---- */
const pubOk = () => { try { return typeof S === 'object' && !!S && Array.isArray(S.slate); } catch (e) { return false; } };
function pubGame(gid) { if (!pubOk()) return null; try { return gameById(gid) || null; } catch (e) { return null; } }
/* who a player's leg is on, by his ESPN athlete id: the leg's own, else the published players by name and club */
function legPid(l) {
  if (l.pid) return l.pid;
  if (!pubOk() || !Array.isArray(S.players)) return null;
  const nm = normName(l.name); if (!nm) return null;
  const m = S.players.filter(x => x && normName(x.name) === nm && (!l.team || x.team === l.team));
  return m.length === 1 ? String(m[0].id) : null;
}
const RES = { won: 'hit', lost: 'missed', push: 'push', void: 'void' };
/* a leg graded by the page's own settlement on the published final: {state, val, line, why} or null where the published
   state has no answer yet (no final, a player's box line not published, a player the page cannot place) */

const legState = l => { const r = liveFor(l); return r ? r.state : null; };
const isOver = p => p.legs.every(l => { const g = view(l.gid); return !!g && (g.state === 'post' || g.state === 'void'); });
const isGone = p => p.legs.some(l => legState(l) === 'missed');
const isDone = p => isOver(p) && p.legs.every(l => ['hit', 'push', 'void', 'missed'].includes(legState(l)));
const isSettled = p => isGone(p) || isDone(p);
function draw() { drawList(); foot(); }
const hereLine = n => `<div class="lp-here"><span>You cleared ${n} parlay${n === 1 ? '' : 's'} on this device</span><button type="button" class="btn" id="lpShowAll">Show ${n === 1 ? 'it' : 'them'} again</button></div>`;
const X_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
function drawList() {
  const app = $lp('lpApp'); if (!app) return;
  if (!STATE.loaded) { app.innerHTML = '<p class="lp-quiet">Reading X’s parlays…</p>'; return; }
  const ps = shown(), nHere = STATE.parlays.length - ps.length;
  let html = '';
  if (STATE.dataErr) html += `<div class="lp-note"><b>X's placed parlays could not be read: ${esc(STATE.dataErr)}</b> They come from <code>liveparlays/parlays.json</code> in the repository, read when this tab opens; the rest of the page is not affected.</div>`;
  else if (STATE.err) html += `<div class="lp-note"><b>Live scores are not loading (${esc(STATE.err)}).</b> This browser could not reach ESPN's live scoreboard, which the page reads directly. An ad or tracker blocker, a VPN, or a work or school network usually causes it; try with the blocker paused, or on another device. The parlays below are still right; only the live numbers against them are stale.</div>`;
  if (!ps.length) {
    if (nHere) { app.innerHTML = html + hereLine(nHere); return; }
    app.innerHTML = html + '<div class="lp-empty"><b>Nothing to watch yet</b></div>';
    return;
  }
  const FAR = Number.MAX_SAFE_INTEGER;
  const kicks = p => p.legs.map(l => kickOf(l.gid)).filter(k => k != null);
  const startsAt = p => { const k = kicks(p); return k.length ? Math.min(...k) : null; }, endsAt = p => { const k = kicks(p); return k.length ? Math.max(...k) : null; };
  const firstDay = p => p.legs.map(l => l.date).sort()[0], lastDay = p => p.legs.map(l => l.date).sort().pop();
  /* the order a night runs in: still to finish first, then by first tip, then by last; a section a slate (the Eastern date
   of a parlay's first game), with a pill where it runs on into a later one; the time shown is the viewer's own */
  const rank = p => { const s = startsAt(p), e = endsAt(p); return [isSettled(p) ? 1 : 0, firstDay(p), s == null ? FAR : s, e == null ? FAR : e]; };
  const cmp = (x, y) => { const a = rank(x), b = rank(y); for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; };
  const sorted = ps.slice().sort(cmp), nSettled = sorted.filter(isSettled).length;
  /* said of the parlays drawn: one cleared on this device may be live still, so with any cleared it speaks for these */
  if (nSettled === sorted.length) html += nHere ? '<p class="lp-quiet">None of the parlays shown here is still live.</p>' : '<p class="lp-quiet">None of X’s parlays is still live.</p>';
  let lastKey;
  for (const p of sorted) {
    const d0 = firstDay(p), d1 = lastDay(p), key = isSettled(p) ? 'settled' : d0;
    if (key !== lastKey) {
      lastKey = key;
      if (key === 'settled') html += `<div class="lp-win lp-done"><b>Finished</b><span>${nSettled} · each clears itself the day after its last game</span></div>`;
      else { const s0 = Math.min(...sorted.filter(q => !isSettled(q) && firstDay(q) === d0).map(q => startsAt(q) == null ? FAR : startsAt(q)));
        html += `<div class="lp-win"><b>${esc(dayLong(d0))} games</b><span>${esc(monDay(d0))}${s0 < FAR ? ` · first tip ${esc(localT(s0))}` : ''}</span></div>`; }
    }
    const runs = !isOver(p) && d1 !== d0 ? `<span class="lp-pill">runs into ${esc(dayLong(d1))} games</span>` : '';
    const states = p.legs.map(legState), gone = states.includes('missed'), voids = states.filter(x => x === 'void').length;
    const back = states.every(x => x === 'void' || x === 'push');
    const tag = gone ? '<span class="lp-pill bad">gone</span>' : isDone(p) ? (back ? `<span class="lp-pill">${voids ? 'void' : 'push'}</span>` : '<span class="lp-pill ok">landed</span>') : '';
    const nv = voids && !gone && !back ? `<span class="lp-pill">${voids} void</span>` : '';
    html += `<div class="lp-p" data-lp-id="${esc(p.id)}">`
      + `<button type="button" class="lp-x" data-lp-clear="${esc(p.id)}" aria-label="Clear this parlay" title="Clear this parlay">${X_ICON}</button>`
      + `<div class="lp-head"><span class="lp-title">${p.legs.length}-leg parlay</span><span class="lp-pill">placed</span>`
      + `<span class="lp-date">${esc(dayShort(p.date))}</span>${p.note ? `<span class="lp-pill lp-pnote">${esc(p.note)}</span>` : ''}${runs}${tag}${nv}</div>`
      + `<div class="lp-money"><div><b>$${(+p.stake || 0).toFixed(2)}</b><span>staked</span></div><div><b>${p.price == null ? '–' : esc(fmtML(p.price))}</b><span>price</span></div>`
      + `<div><b>${p.payout ? '$' + (+p.payout).toFixed(2) : '–'}</b><span>pays</span></div></div>`
      + gameStrip(p) + p.legs.map(legRow).join('') + '</div>';
  }
  if (nHere) html += hereLine(nHere);
  app.innerHTML = html;
}
/* the live stamp (when the scores were last read) and, under the heading, when X's parlays last changed */
function foot() {
  const st = $lp('lpStamp');
  if (st) st.textContent = STATE.busy ? 'reading…' : STATE.err || STATE.dataErr ? 'not updating' : STATE.at ? 'scores ' + new Date(STATE.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' }) : STATE.loaded ? 'loaded' : 'idle';
  const up = $lp('lpUpdated');
  if (up) up.textContent = 'X’s placed parlays, followed live through their games'
    + (STATE.updated != null ? ' · updated ' + new Date(STATE.updated).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '');
}

/* ---- Clear this parlay?: the X opens it; Cancel, Escape or a click outside closes it and clears nothing; Clear takes
   the parlay off this device's X Parlays. Tab stays inside the window and the focus goes back to the X (after a Clear,
   to the X now in its place, else to Show them again). Nothing is sent anywhere ---- */
let askId = null, askAt = 0;
/* a tap within a moment of the window opening is the same finger's double tap on the X, not an answer: it neither
   clears (Clear can sit right under the X on a phone) nor closes. A key's click (no pointer, detail 0) always counts */
const tooSoon = e => !!e && e.detail > 0 && Date.now() - askAt < 400;
const askOpen = () => { const d = $lp('lpAsk'); return !!d && !d.hidden; };
const xFor = id => [...document.querySelectorAll('#lpApp [data-lp-clear]')].find(b => b.getAttribute('data-lp-clear') === id) || null;
function ask(id) {
  const p = STATE.parlays.find(x => x.id === id), d = $lp('lpAsk'); if (!p || !d) return;
  askId = id;
  $lp('lpAskWhat').textContent = [`${p.legs.length}-leg parlay`, dayShort(p.date), p.price != null ? fmtML(p.price) : '', p.note || ''].filter(Boolean).join(' · ');
  d.hidden = false; askAt = Date.now(); document.body.classList.add('pp-lock');
  try { $lp('lpAskNo').focus(); } catch (e) {}
}
/* quiet: closed because the visitor left the tab, so the focus is not sent back into it */
function askClose(clear, quiet) {
  const d = $lp('lpAsk'); if (!d || d.hidden) return;
  const id = askId; askId = null; d.hidden = true;
  if (!document.querySelector('.pp-back:not([hidden])')) document.body.classList.remove('pp-lock');
  let back = null;
  if (clear && id) {
    const xs = [...document.querySelectorAll('#lpApp [data-lp-clear]')], at = xs.indexOf(xFor(id)), list = hereNow();
    hereWrite(list.some(x => x.id === id) ? list : list.concat([{ id, at: new Date().toISOString() }]));
    draw();
    const now = [...document.querySelectorAll('#lpApp [data-lp-clear]')];
    back = now[Math.min(Math.max(at, 0), now.length - 1)] || $lp('lpShowAll') || $lp('lpNow');
  } else back = xFor(id) || $lp('lpNow');
  if (!quiet) try { if (back) back.focus(); } catch (e) {}
}
function showAgain() {
  /* the ones this tab shows as cleared come back; one another tab cleared since stays cleared */
  const mine = new Set(STATE.here.map(x => x.id));
  hereWrite(hereNow().filter(x => !mine.has(x.id)));
  draw();
  const first = document.querySelector('#lpApp [data-lp-clear]'); try { if (first) first.focus(); } catch (e) {}
  /* their games were not followed while they were cleared: read them now */
  if (STATE.busy) STATE.again = true; else refresh();
}
$lp('lpApp').addEventListener('click', e => {
  const x = e.target && e.target.closest && e.target.closest('[data-lp-clear]');
  if (x) { ask(x.getAttribute('data-lp-clear')); return; }
  if (e.target && e.target.closest && e.target.closest('#lpShowAll')) showAgain();
});
$lp('lpAskNo').addEventListener('click', () => askClose(false));
$lp('lpAskYes').addEventListener('click', e => { if (!tooSoon(e)) askClose(true); });
$lp('lpAsk').addEventListener('click', e => { if (e.target === e.currentTarget && !tooSoon(e)) askClose(false); });
$lp('lpNow').addEventListener('click', () => refresh());
/* another tab of the site cleared a parlay, or showed them again: this one follows (the NFL hub's key is not this one) */
window.addEventListener('storage', e => {
  if (e.key !== HERE_KEY && e.key !== null) return;
  if (hereMem) return;
  const v = hereLoad(); if (v === null) return;
  const back = STATE.here.some(x => !v.some(y => y.id === x.id));
  STATE.here = v;
  if (!STATE.shown) return;                                    // nothing drawn or read before the tab is first shown
  draw();
  if (back) { if (STATE.busy) STATE.again = true; else refresh(); }
});
/* Escape ahead of the windows beneath it, so it closes this one alone; Tab kept inside */
window.addEventListener('keydown', e => {
  if (!askOpen()) return;
  /* a window left open on a tab no longer shown is closed, and the key goes where it was meant */
  if ($lp('lpAsk').parentElement.closest('[hidden]')) { askClose(false, true); return; }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); askClose(false); return; }
  if (e.key !== 'Tab') return;
  const f = [$lp('lpAskNo'), $lp('lpAskYes')], at = document.activeElement;
  if (e.shiftKey && (at === f[0] || !$lp('lpAsk').contains(at))) { e.preventDefault(); f[1].focus(); }
  else if (!e.shiftKey && (at === f[1] || !$lp('lpAsk').contains(at))) { e.preventDefault(); f[0].focus(); }
}, true);
/* the page's tab code: the first show in a page load reads the file and ESPN, every later show draws what was read; a
   tab change closes the window, quietly, clearing nothing */
window.lpShow = () => { if (!STATE.shown) { STATE.shown = true; draw(); refresh(); } else draw(); };
window.lpLeave = () => { const s = $lp('tab-xparlays'); if (askOpen() && s && s.hidden) askClose(false, true); };
window.lpRefresh = refresh;
/* what the smoke test reads */
window.NBA_LP = { key: HERE_KEY, readFile, gidParts, sbGames, boxSide, liveLeg, liveGameLeg, liveTotal, state: () => STATE };
foot();
})();
</script>
