<!-- The parlay card (README "The parlay card"): the NFL hub's (its nflbets/build/card.html at app v114) on this page, set
     in by build.js at its part:card marker: its styles, its window and its script, every class and id prefixed
     pc-, the script one closure. Finish parlay in the Parlay Builder, and a suggested level's Finish wherever a tab draws
     one, opens this window with the parlay drawn as a card: each leg and its price, the parlay's price, the stake (the one
     Bet amount) and what it pays, DraftKings' fair chance first, the model's beside it (on trial with a player leg in it)
     and the chance the price implies, the day and its date, and the site's mark. Download image saves it as a PNG, drawn
     on a canvas at twice its size; where the browser can share a file (a phone) the share sheet is offered too, which is
     how an image reaches Photos. Open in DraftKings opens the parlay on DraftKings' betslip from the game lines' betslip
     ids (lines.json's, or a Refresh odds press's): ESPN's feed carries none for a player's line, so a player's leg is one
     to add by hand, and says so. Share link sends the parlay as one plain text with that link in it. Nothing is saved: not
     in the visitor's builder, not in X's parlays, not in any key of this page. The price is the builder's own: the card
     calls the Parlay Builder's pricing (pbQuote, parlayDec, parlayProb, parlayFair), never a sum of its own. -->
<style>
/* ---------- the parlay card (app/parts/card.html; README "The parlay card") ----------
   The window is the page's (a .pp-back over the page, its sheet); the card inside it is drawn in the site's own colours
   written out, the page's dark tokens with its orange accent, so it looks the same here as in the image it downloads */

  font-family:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.4}
.pc-head{background:linear-gradient(135deg,#30374B 0%,#343B50 55%,#3A4258 100%);color:#fff;padding:16px 20px 15px;position:relative}

.pc-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pc-title{font-family:"Unbounded",ui-sans-serif,system-ui,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.15}

/* what Open in DraftKings opens, and the legs it cannot, under the buttons; each leg's own link a 44px target */

  .pc-title{font-size:19px} .pc-price{font-size:24px} .pc-money div{padding:7px 8px} .pc-money b{font-size:clamp(14px,4.2vw,16px)}

</style>
<div class="pp-back" id="pcBack" hidden><div class="pp-sheet pc-sheet" id="pcSheet" role="dialog" aria-modal="true" aria-labelledby="pcTitle" tabindex="-1">
  <div class="pc-top"><h2 id="pcTitle">Your parlay card</h2><span class="pc-grow"></span><button type="button" class="btn ghost" id="pcClose">Close</button></div>
  <div id="pcView"></div>
  <div class="pc-actions">
    <a class="btn pc-dkbtn" id="pcDk" href="https://sportsbook.draftkings.com/leagues/basketball/nba" target="_blank" rel="noopener" hidden>Open in DraftKings</a>
    <button type="button" class="btn" id="pcLink" title="Send this parlay and its DraftKings link to someone">Share link</button>
    <button type="button" class="btn hot" id="pcDownload">Download image</button>
    <button type="button" class="btn" id="pcShare" hidden>Share or save to Photos</button>
    <button type="button" class="btn ghost" id="pcAgain" title="Clear the Parlay Builder and start a new parlay">Start over</button>
  </div>
  <div class="pc-dk" id="pcDkNote"></div>
  <p class="pc-msg" id="pcMsg" role="status" aria-live="polite"></p>
  <p class="pc-note">Yours alone: this card is not saved anywhere, on this site or in X&#8217;s parlays. Change the builder and finish again for a new one.</p>
</div></div>
<script>
/* ---------- the parlay card (README "The parlay card") ----------
   window.PARLAY_CARD: the window over the page, its card (the window's and the image's, drawn from one model), Open in
   DraftKings, Share link, Download image and Start over. It reads the page's globals (S, M, the Parlay Builder's pricing
   and lines) only when it is used, so it may sit anywhere in the page. A tab that draws a suggested level's Finish
   (data-pc-finish="<prefix>|<id>": Suggested Parlays' "sp|<game id>:<level>", the Elo picks' "elo|<level>") registers a
   resolver for its prefix, PARLAY_CARD.from(prefix, id => ({ legs, kicker, chance, chanceBy })), and one listener here
   opens the card for whichever is pressed; the card prices the legs by the builder's own sums */
window.PARLAY_CARD = (function () {
  'use strict';
  const SITE = 'demon-x13.github.io/nba-hub';
  const el = id => document.getElementById(id);
  const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /* every dollar figure whole, with its thousands marked: $17,620.00 */
  const money = v => '$' + (+v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pct = p => p > 0 && p < 0.0005 ? '<0.1%' : (p * 100).toFixed(1) + '%';      // a long shot reads as under a tenth of a percent, not 0.0%
  const ml = x => x == null || !isFinite(x) ? '–' : (x > 0 ? '+' + x : '−' + Math.abs(x));
  const ET = { timeZone: 'America/New_York' };
  /* a game's day is its Eastern date, as the page lists it: "Sun Oct 25", in English wherever the card is made, since
     it goes to other people */
  const dayOf = d => { const x = new Date(d + 'T12:00:00Z'); return isNaN(x) ? String(d || '') : x.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }) + ' ' + x.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); };
  const whenOf = iso => { const t = Date.parse(iso); return isFinite(t) ? new Date(t).toLocaleString('en-US', Object.assign({ weekday: 'short', hour: 'numeric', minute: '2-digit' }, ET)) + ' ET' : ''; };
  /* when DraftKings' lines were read: the day and date too, since a read can be a day old */
  const readOf = d => d.toLocaleString('en-US', Object.assign({ weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }, ET)) + ' ET';
  const dt = iso => { const t = Date.parse(iso); return isFinite(t) ? new Date(t) : null; };
  /* the days the legs are played on: one day, or the first and the last */
  function dates(legs) {
    const ds = [...new Set(legs.map(l => l.date).filter(Boolean))].sort();
    if (!ds.length) return '';
    const a = dayOf(ds[0]), b = dayOf(ds[ds.length - 1]);
    return a === b ? a : a + ' – ' + b;
  }
  const game = gid => (typeof S === 'object' && S && Array.isArray(S.slate)) ? S.slate.find(g => g.id === gid) || null : null;
  const tipped = l => { const g = game(l.id || l.gid); try { return !g || (typeof started === 'function' && started(g)); } catch (e) { return false; } };
  const nick = t => (typeof TEAMS === 'object' && TEAMS && TEAMS[t]) ? TEAMS[t][1] : t;
  const spTxt = v => (v > 0 ? '+' : '') + String(+v);

  /* the builder's numbers, as renderParlay works them out (pbQuote in app/parts/parlay.html: the same function draws
     the builder), so the card's price can never drift from the one the builder shows */
  function quote() { try { return typeof pbQuote === 'function' ? pbQuote() : null; } catch (e) { return null; } }
  /* one leg as the card shows it: who, what (the bet as the builder labels it), the game and its tip-off in ET, and its
     price; every price here is DraftKings' own (lines.json's, or a Refresh odds press's), so its tag is book */
  function leg(l, price) {
    const meta = [l.kind === 'prop' ? l.pos : '', l.team && l.opp ? l.team + ' v ' + l.opp : '', whenOf(l.tip)].filter(Boolean).join(' · ');
    return { who: l.name || '', what: l.label || '', meta, price: ml(price), tag: 'book' };
  }

  /* ---- DraftKings: the parlay on DraftKings' betslip ----
     DraftKings opens several outcomes on its betslip at ?outcomes=<id>+<id>, each id encoded ('#' as %23). Only game
     lines carry an id on ESPN's feed: lines.json's ids (the event, each moneyline, spread and total outcome at its own
     number, tools/lines.js) and a Refresh odds press's (oddsGameLines, each id kept only in its side's shape and naming
     its own number), and each game leg keeps the id it was added with (dk, dated by its read). A player's line has none,
     so a player's leg is one to add by hand, and says so. An id names one outcome at one number, so a line DraftKings has
     moved or pulled since the read is not on the slip, and DraftKings drops it without a word: the note dates the read
     (the oldest of the legs it opens) and says the link opens the legs as DraftKings had them then, never that every leg
     will land. Where DraftKings has the same bet only at another number (a spread the same team's, a total the same
     side) the leg goes on there rather than off the slip, and the note says so (the NFL hub's rule, app v109) */
  const DKS = 'https://sportsbook.draftkings.com/', DKNBA = DKS + 'leagues/basketball/nba';
  const dkUrl = ids => DKS + '?outcomes=' + ids.map(encodeURIComponent).join('+');
  const PLAYER_WHY = { why: 'DraftKings’ player lines carry no betslip id in ESPN’s feed', brief: 'no betslip id in ESPN’s feed' };
  /* a game's lines as the Parlay Builder prices them: the newer of lines.json's read and a press's (pbGl) */
  const lines = gid => { try { return typeof pbGl === 'function' ? pbGl(gid) : null; } catch (e) { return null; } };
  const carries = G => { try { return typeof pbCarries === 'function' ? pbCarries(G) : !!(G && G.event); } catch (e) { return false; } };
  /* one leg: {id, at} where DraftKings has it at the leg's own line; {id, at, swap, now} where DraftKings has the same
     bet only at another number, and the leg goes on at DraftKings' (swap: what goes on, in the page's words); else
     {why, brief} (brief: the same in a few words, for the text Share link sends).
     The ids a game leg can go on with: its own (read with it, at its own number) and the game's current lines' (the newer
     of lines.json and a press). The newer of the two is taken: at the leg's own number it is the same bet; at another
     number DraftKings has moved the line since the leg's read, and the leg goes on at DraftKings' number. A moneyline
     has no number: the newer id for that team, or nothing */
  function dkLeg(l) {
    if (tipped(l)) return { why: 'its game has tipped off', brief: 'its game has tipped off' };
    if (l.kind === 'prop') return Object.assign({}, PLAYER_WHY);
    const G = lines(l.id), s = l.kind === 'total' ? (l.side === 'under' ? 'under' : 'over') : (l.side === l.home ? 'home' : 'away');
    const ownP = l.kind === 'ml' ? null : +l.line, own = l.dk ? { id: String(l.dk), at: dt(l.at), p: ownP } : null;
    let cur = null;
    if (G) { const at = dt(G.at), x = l.kind === 'ml' ? G.ml && G.ml[s] : l.kind === 'spread' ? G.spread && G.spread[s] : G.total && G.total[s];
      if (x && x.id) cur = { id: String(x.id), at, p: l.kind === 'ml' ? null : l.kind === 'spread' ? +x.line : +G.total.line }; }
    const newer = (a, b) => (a.at ? +a.at : 0) > (b.at ? +b.at : 0);
    const say = p => l.kind === 'spread' ? `${nick(l.side)} ${spTxt(p)}` : `${l.side === 'under' ? 'Under' : 'Over'} ${String(+p)} points`;
    const take = x => x.p === ownP ? { id: x.id, at: x.at } : { id: x.id, at: x.at, swap: say(x.p), now: x.p };
    if (cur && own) return newer(cur, own) ? take(cur) : take(own);
    if (own || cur) return take(own || cur);
    const what = { ml: 'moneyline', spread: 'spread', total: 'total' }[l.kind] || 'line';
    if (!G) return { why: 'its game’s DraftKings lines have not been read yet: the job reads them through the day, and Refresh odds reads them now', brief: 'its game’s lines are not read yet' };
    if (!carries(G)) return { why: 'no DraftKings betslip id was read for its game', brief: 'no betslip id read for its game' };
    return { why: `DraftKings’ ${what} for it carried no betslip id when its lines were read (${readOf(dt(G.at) || new Date(0))})`, brief: `no ${what} id read` };
  }
  /* the parlay: the betslip link for every leg DraftKings has, in the card's order, the legs it cannot open, and the
     game's own page where every leg is in one game to come */
  function dkPlan(legs) {
    legs = legs || [];
    const each = legs.map((l, i) => Object.assign({ n: i + 1, who: (l.card && l.card.who) || l.name || '', what: (l.card && l.card.what) || l.label || '' }, dkLeg(l)));
    const ok = each.filter(x => x.id), miss = each.filter(x => !x.id);
    let event = null;
    if (legs.length && legs.every(l => l.id === legs[0].id) && !tipped(legs[0])) { const G = lines(legs[0].id); if (G && G.event) event = DKS + 'event/' + encodeURIComponent(G.event); }
    /* the read the link stands on: the oldest of the legs it opens (null where one is undated). It dates what the link
       opens; however recent, it promises nothing (see above) */
    const undated = ok.some(x => !x.at), read = ok.length && !undated ? new Date(Math.min(...ok.map(x => +x.at))) : null;
    return { url: ok.length ? dkUrl(ok.map(x => x.id)) : null, ok, miss, swaps: ok.filter(x => x.swap), each, event, home: event || DKNBA, n: legs.length, read };
  }

  /* the card: everything it shows, worked out once, drawn twice (the window, and the image) */
  function card({ kicker, legs, dec, priceNote, chance, chanceBy, trial, fair, stake, source, sg }) {
    const n = legs.length, first = legs.map(l => l.date).filter(Boolean).sort()[0] || '';
    const am = typeof decToAm === 'function' && dec > 1 ? decToAm(dec) : null;
    return { source, kicker, title: n + '-leg parlay', dateText: dates(legs), price: ml(am), dec: isFinite(dec) ? dec.toFixed(2) : '–', implied: dec > 1 ? pct(1 / dec) : '–', priceNote,
      legs: legs.map(x => x.card), stake: stake > 0 ? stake : 0, payout: stake > 0 ? stake * dec : 0, profit: stake > 0 ? stake * dec - stake : 0,
      chance: chance != null && isFinite(chance) ? pct(chance) : null, chanceBy: chanceBy || 'Model', trial: !!trial,
      fair: fair && fair.p != null && isFinite(fair.p) ? pct(fair.p) : null, fairEst: !!(fair && fair.p != null && fair.est), sg: !!sg,
      oneSided: legs.some(l => l.kind === 'prop' && l.mk !== 'main'),
      made: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }), site: SITE,
      file: 'parlay-' + (first ? first + '-' : '') + n + (n === 1 ? 'leg' : 'legs') + '.png', dk: dkPlan(legs) };
  }
  /* from the builder: its legs as they stand, in its order, priced as the builder prices them */
  function fromBuilder() {
    const q = quote(); if (!q) return null;
    const legs = q.legs.map(l => Object.assign({}, l, { card: leg(l, l.odds) }));
    return card({ source: 'builder', kicker: 'Your parlay', legs, dec: q.useDec,
      priceNote: q.override != null ? 'your book’s price' : q.sg ? 'estimated same-game price' : 'book price',
      chance: q.pr.corr, chanceBy: 'Model', trial: q.trial, fair: q.fair, stake: q.stake, sg: q.sg && q.override == null });
  }
  /* a suggested level's legs, from the resolver its tab registered: each leg as the builder draws it (pbView), in the
     builder's order, priced by the builder's own sums on the prices they carry; the chance the level's own where it
     says so (an Elo pick's is the Elo's), else the model's */
  const FROM = {};
  function from(prefix, fn) { if (typeof prefix !== 'string' || !/^[\w-]+$/.test(prefix) || typeof fn !== 'function') return false; FROM[prefix] = fn; return true; }
  function fromTier(kind, id) {
    const fn = FROM[kind]; if (typeof fn !== 'function') return null;
    let t = null; try { t = fn(id); } catch (e) { t = null; }
    if (!t || !Array.isArray(t.legs) || !t.legs.length) return null;
    let L = null;
    try { L = pbOrder(t.legs.map(l => l && l.sk && l.label ? Object.assign({}, l) : pbView(pbSlipOf(l)))); } catch (e) { return null; }
    for (const l of L) { if (l.price == null) l.price = l.odds; l.card = leg(l, l.price); }
    const dec = parlayDec(L.map(l => ({ leg: l, ml: l.price }))), sg = new Set(L.map(l => l.id)).size < L.length;
    const chance = t.chance !== undefined ? t.chance : parlayProb(L).corr;
    return card({ source: kind, kicker: String(t.kicker || 'Suggested parlay'), legs: L, dec, priceNote: sg ? 'estimated same-game price' : 'book price',
      chance, chanceBy: t.chanceBy === 'Elo' ? 'Elo' : 'Model', trial: L.some(l => l.kind === 'prop'), fair: parlayFair(L), stake: typeof pbStake === 'function' ? pbStake() : 20, sg });
  }
  /* the Parlay Builder's own four levels over the games ticked (getPbTiers), which a level's card drawn with no prefix
     of its own finishes (pbTierCard's default "pb|<level>") */
  from('pb', id => { const t = typeof getPbTiers === 'function' ? getPbTiers().tiers.find(x => x.id === id && x.legs) : null; return t ? { legs: t.legs, kicker: t.label + ' parlay' } : null; });
  /* and, until a tab registers its own, the NFL hub's names for the two that draw levels: Suggested Parlays' window.spTier
     ("<game id>:<level>", the level as the tab shows it, live or locked) and the Elo picks' window.eloPicks() (its levels,
     their chance the Elo's) */
  from('sp', id => { const t = typeof window.spTier === 'function' ? window.spTier(id) : null;
