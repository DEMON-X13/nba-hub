<!-- The matchup bubble (README "The matchup bubble"): the NFL hub's (its nflbets/build/glance.js at app v114) on this
     page's numbers, set in by build.js at its part:glance marker: its styles, every class prefixed glance-, and its script
     in a closure. A leg's name on the Parlay Builder tab (a Top 50 row, a builder row) and on any level card a tab draws
     with pbTierCard is a button (glanceName in app/parts/parlay.html, drawn only where this part is on the page,
     window.hubGlance); a click opens a small window anchored to it with that leg's matchup at a glance. It fetches nothing
     of its own and keeps nothing: every number is read from what the page already has (state.json, the lines the Parlay
     Builder prices from, and pickem.json, the Pick'em Record's own read, once a page load). -->
<style>

   moves. The bubble sits under the page's windows (.pp-back, z-index 20) */
.glance-name{-webkit-appearance:none;appearance:none;position:relative;z-index:1;display:inline-block;box-sizing:border-box;min-height:44px;max-width:100%;margin:-14px 0;padding:14px 0;border:0;border-radius:4px;background:none;font:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;text-align:inherit;vertical-align:baseline;cursor:pointer;overflow-wrap:anywhere;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px;box-shadow:none}
.glance-name:hover{text-decoration-style:solid;text-decoration-color:var(--hot-2)}
.glance-name:focus{outline:none}
.glance-name:focus-visible::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:calc(1.35em + 6px);transform:translateY(-50%);border:2px solid var(--ink);border-radius:6px;pointer-events:none}
.glance-pop{position:absolute;z-index:15;box-sizing:border-box;width:360px;max-width:calc(100vw - 16px);overflow:auto;overscroll-behavior:contain;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 18px 44px -14px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.3);padding:6px 14px 14px;font-family:var(--body);font-size:13px;line-height:1.45;text-align:left}
.glance-pop[hidden]{display:none}
.glance-pop:focus{outline:none}
.glance-pop.glance-sheet{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;max-height:min(78vh,640px);border-radius:18px 18px 0 0;border-bottom:0;padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.glance-hd{display:flex;align-items:center;gap:10px;margin:0 -4px 0 0}
.glance-title{flex:1 1 auto;min-width:0;margin:0;font:700 16px/1.3 var(--body);color:var(--ink);overflow-wrap:anywhere}
.glance-x{flex:none;min-height:44px;min-width:44px;padding:0 12px;font-size:13px}
.glance-sub{margin:0 0 8px;color:var(--ink-2);font-size:12.5px}
.glance-inj{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:6px;border:1px solid #FFA2B8;color:#FFA2B8;vertical-align:1px}
.glance-q{color:var(--ink-2);font-weight:500}

.glance-sh .tierbadge{width:16px;height:18px}
.glance-tm{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--ink)}
.glance-trial{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:0 5px;border:1px solid #FFA2B8;border-radius:999px;color:#FFA2B8;white-space:nowrap;margin-left:5px;vertical-align:1px}

.glance-line{margin:0 0 8px;color:var(--ink)}
.glance-k{display:inline-block;margin-right:6px;color:var(--ink-2);font-size:12px;font-weight:600}
.glance-h4{margin:8px 0 4px;color:var(--ink-2);font-size:12px;font-weight:700}

@media(max-width:400px){.glance-picks{grid-template-columns:minmax(0,1fr)}}
</style>
<script>
/* ---------- the matchup bubble (README "The matchup bubble") ----------
   The NFL hub's owner, 17 October 2026: "in the parlay builder, when i click on a player or a team, bring up a bubble pop
   up where it shows their matchup for the day so i can see info at a glance." Carried here on 25 October 2026 with the
   NBA's numbers.

   A leg's name is a button (glanceName in app/parts/parlay.html): data-glance "p:<ESPN athlete id>" for a player's line,
   "t:<ABBR>" for a team's moneyline or spread, "g:<game id>" for a game total, the leg's game in data-glance-game and the
   leg itself kept by its signature (window.glanceLeg). One click on a name (Enter and Space too: it is a button) opens a
   small window anchored to it: below the name, above it where there is no room below, kept inside the screen; a sheet
   across the foot of the screen at 640px and under, and wherever neither side of the name has 160px for it (a landscape
   phone). It is role="dialog" aria-modal="false", labelled by its heading; the focus moves into it and Tab stays inside
   while it is open; Escape, Close (44px), a click outside it or a click on another name close it, the focus going back
   to the name. It sits under the page's windows.

   The same leg can be drawn in several places at once (its Top 50 row and its builder row, a level card and another), so
   the bubble keeps the place it was opened from (placeOf) and the leg's key, side and line, and when the page draws its
   rows again while it is open (a MutationObserver, connected only then) it is bound to that place's copy of the leg
   (marked open, drawn and placed again with the copy's numbers), or closed, the focus on the leg's neighbour there,
   where that place no longer draws the leg. Drawn again, it keeps where the reader had scrolled it.

   A player's bubble: his position and club and his status on the injury report as the page reads it; his overall Elo
   with its tier shield and tier, and his rank among the rated players at his position (the Players tab's own numbers,
   state.json's players), or why the ladder does not rank him; the game and its tip-off in ET; what he faces: the
   opponent's defence as the player model rates it (the Teams tab's Defence column, ranked as that column sorts; the
   opponent's offence for a steals or blocks line, made at the other end); the props model's projection for his minutes
   and the leg's stat, on trial; and the leg: its line, the price its row shows, the model's chance (on trial) and
   DraftKings' fair chance. A team's or a game total's bubble: both records this season as the standings count them (the
   Pick'em Record's finals, the NBA Cup final and the play-in left out), each club's strength and its rank (the Teams tab), the line the leg stands on (the Parlay Builder's own: DraftKings' as the
   job read it or a press, the newer), offence against defence each way, and each model's pick and chance (Vegas, the
   Player Model, Team Elo, the Alpha Model, the Joker and the ELO Model: the last three from pickem.json, its games to
   today and its next after them), the leg's team marked "this leg" and, on a
   moneyline alone, each model picking that team to win ticked; then the leg and a button to the game on Tonight. What a
   file has not given says so in its own line, and the rest draws */
(function () {
'use strict';
const H = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || 'th');
const pc0 = p => (p * 100).toFixed(0) + '%';
const N = (key, v) => `<b data-glance-n="${H(key)}">${H(v)}</b>`;
const St = () => (typeof S === 'object' && S) ? S : null;
/* a club by its code, in the bubble's ink (a club's own colour on the panel falls under 4.5:1 for several clubs) */
const tag = t => `<b class="glance-tm">${H(t)}</b>`;
const nickOf = t => (typeof TEAMS === 'object' && TEAMS[t]) ? TEAMS[t][1] : t;
const amTxt = v => v == null || !isFinite(v) ? '–' : (v > 0 ? '+' : '−') + Math.abs(Math.round(v));
/* a rating in points with its sign, rounded as the Teams tab rounds it (toFixed, which rounds the size: −45.5 is −46,
   where Math.round would say −45), with a true minus */
const signed0 = v => { if (v == null || !isFinite(v)) return '–'; const s = Math.abs(v).toFixed(0); return (s === '0' ? '' : v > 0 ? '+' : '−') + s; };
const game = gid => { const s = St(); return s && Array.isArray(s.slate) ? s.slate.find(g => g.id === gid) || null : null; };
/* a tip-off in ET, the game's own Eastern date: "Sun Oct 25 · 7:00 PM ET" (in English, as the card writes it) */
function kickOf(g) {
  if (!g) return '';
  const x = new Date(g.date + 'T12:00:00Z'), d = isNaN(x) ? String(g.date || '') : x.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }) + ' ' + x.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const t = g.tip && isFinite(Date.parse(g.tip)) ? new Date(g.tip).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET' : '';
  return t ? d + ' · ' + t : d;
}
/* the Teams tab's own ranking of a column: its rows sorted high to low on it (its table's sort, which keeps the file's
   order on a tie), a club's place in it */
function teamRank(key, t) {
  const s = St(); if (!s || !s.teams || !s.teams[t] || !isFinite(s.teams[t][key])) return null;
  const rows = Object.entries(s.teams).filter(([, v]) => isFinite(v[key])), sorted = [...rows].sort((a, b) => a[1][key] === b[1][key] ? 0 : a[1][key] < b[1][key] ? 1 : -1);
  return { v: s.teams[t][key], rank: sorted.findIndex(([x]) => x === t) + 1, n: sorted.length };
}
/* the Pick'em Record's file (pickem.json): its own read, once a page load (window.NBA_PICKEM.load), asked for by a
   team's bubble where the tab has not read it yet; a read that fails is made again by the next team's bubble */
let PK_WAIT = null, PK_FAILED = false;
function pkData() {
  const P = window.NBA_PICKEM; if (!P || typeof P.data !== 'function') return { err: true };
  const d = P.data(); if (d) return { d };
  if (PK_FAILED) return { err: true };
  if (!PK_WAIT && typeof P.load === 'function') PK_WAIT = Promise.resolve(P.load()).catch(() => null).then(() => { PK_WAIT = null; PK_FAILED = !P.data(); if (cur) draw(); });
  return PK_WAIT ? { wait: true } : { err: true };
}
/* the leg the bubble was opened from, as its row drew it */
const legOf = sig => sig && typeof window.glanceLeg === 'function' ? window.glanceLeg(sig) : null;

let cur = null, box = null;
/* where a name is drawn, worked out from the page when the bubble opens, so a redraw finds the same copy of it: the
   builder (#parlayBody), the Top 50 lines (#pbPanel), or a level card (.pb-tier[data-pb-tier]) in its section, a set's
   under its game ([data-sp-game]) and an Elo pick's under #pbElo; anywhere else the nearest element with an id. Within
   one place a leg is drawn once: the builder holds one leg a stat, the list each bet once, a card one leg a player. A
   leg is known there by its key, side and line (its signature less the price, its source and the model's chance, which
   a Refresh odds press can move while the leg stays) */
const qv = v => '"' + String(v).replace(/["\\]/g, '\\$&') + '"';
const legId = sig => { const p = String(sig || '').split('|'); return p.length > 3 ? p.slice(0, -3).join('|') : p.join('|'); };
function placeOf(btn) {
  const sec = btn.closest('#parlayBody,#pbPanel,#pbElo,[data-sp-game]') || btn.closest('[id]'); if (!sec) return null;
  const s = sec.id ? `[id=${qv(sec.id)}]` : `[data-sp-game=${qv(sec.dataset.spGame)}]`, card = btn.closest('.pb-tier[data-pb-tier]');
  return card && sec.contains(card) ? `${s} .pb-tier[data-pb-tier=${qv(card.dataset.pbTier)}]` : s;
}
const namesIn = el => el ? [...el.querySelectorAll('[data-glance]')] : [];
const sameLeg = (b, c) => b.dataset.glance === c.of && (b.dataset.glanceGame || '') === c.gid && legId(b.dataset.glanceLeg) === c.leg;
/* the open bubble's name: the one it was opened from while that is on the page, else, after a redraw, the same leg's
   copy in the same place (marked open, and the bubble's leg the copy's, so its numbers follow a new price) */
function anchor() {
  if (!cur) return null;
  if (cur.from && cur.from.isConnected) return cur.from;
  const pl = cur.place ? document.querySelector(cur.place) : null, same = namesIn(pl).find(b => sameLeg(b, cur)) || null;
  if (same) { cur.from = same; same.setAttribute('aria-expanded', 'true');
    if (same.dataset.glanceLeg !== cur.sig) { cur.sig = same.dataset.glanceLeg || ''; cur.stale = true; } }
  return same;
}

/* ---- the leg it was opened from ---- */
const trialMark = () => '<i class="glance-trial" title="The props model is on trial: not yet shown to beat DraftKings">on trial</i>';
function legHtml(K) {
  if (!K || !K.leg) return '';
  const l = K.leg, out = [];
  out.push(`<div><dt>Price</dt><dd>${N('price', amTxt(K.price))}</dd></div>`);
  out.push(`<div><dt>Model</dt><dd>${l.p != null && isFinite(l.p) ? N('model', pc0(l.p)) + (l.kind === 'prop' ? trialMark() : '') : '<span class="glance-q" data-glance-n="model">none</span>'}</dd></div>`);
  let f = null; try { f = typeof legFair === 'function' ? legFair(Object.assign({}, l, { odds: K.price })) : null; } catch (e) { f = null; }
  out.push(`<div><dt>Fair</dt><dd>${f && f.p != null ? N('fair', pc0(f.p) + (f.est ? ' est.' : '')) : '<span class="glance-q" data-glance-n="fair">none</span>'}</dd></div>`);
  return `<div class="glance-leg" data-glance-legbox><p class="glance-lt"><span class="glance-k">This leg</span> ${N('label', l.label || '')}</p><dl class="glance-nums">${out.join('')}</dl></div>`;
}
function tonightBtn(gid) {
  return game(gid) ? `<div class="glance-acts"><button type="button" class="btn ghost glance-tonight" data-glance-tonight="${H(gid)}">Open game on Tonight</button></div>` : '';
}

/* ---- a player ---- */
/* a steals or blocks line is made at the other end of the floor: he faces the opponent's offence there; every other
   line (points, rebounds, assists, threes, their sums, a double- or triple-double) its defence */
const AT_DEF = new Set(['stl', 'blk', 'sb']);
const POS = { G: 'guards', F: 'forwards', C: 'centers', PG: 'point guards', SG: 'shooting guards', SF: 'small forwards', PF: 'power forwards' };
const STATS = [['min', 'Minutes'], ['pts', 'Points'], ['reb', 'Rebounds'], ['ast', 'Assists'], ['tpm', 'Threes']];
function playerHtml() {
  const s = St(), pid = cur.id, gid = cur.gid, K = legOf(cur.sig), L = K && K.leg, g = game(gid);
  const P = s && Array.isArray(s.players) ? s.players.find(p => p.id === pid) || null : null;
  let row = null; try { row = typeof ppRow === 'function' ? ppRow(gid, pid) : null; } catch (e) { row = null; }
  const name = (L && L.name) || (row && row[0]) || (P && P.name) || pid, team = (L && L.team) || (row && row[1]) || (P && P.team) || '';
  const pos = (row && row[2]) || (P && P.pos) || '';
  const opp = g ? (team === g.home ? g.away : team === g.away ? g.home : '') : '', home = g && opp ? team === g.home : null;
  /* his status as the page reads it: on the injury report (the lineups' absentees), or not projected */
  let out = ''; try { out = g && typeof ppOut === 'function' ? ppOut(g, pid) : ''; } catch (e) { out = ''; }
  const projected = !!row, gameProj = typeof ppGame === 'function' && !!ppGame(gid);
  const chip = out ? `<span class="glance-inj" data-glance-n="inj" title="On the injury report: ${H(out)}">${/out/i.test(out) ? 'OUT' : H(String(out).toUpperCase())}</span>`
    : !projected && gameProj ? `<span class="glance-inj" data-glance-n="inj" title="The props model does not project him for this game: on no list it reads, or under ${s && s.props ? s.props.minShown : 8} minutes">NOT PROJECTED</span>` : '';
  const sub = `<p class="glance-sub"><span data-glance-n="pos">${H(pos)}</span>${team ? ` · <span data-glance-n="team">${H(team)}</span>` : ''}${chip}</p>`;
  const lines = [];
  /* his overall Elo, its shield and tier, and his rank at his position, as the Players tab rates and ranks him */
  if (P && isFinite(P.rating)) {
    lines.push(`<div><dt>Overall Elo</dt><dd><span class="glance-sh">${typeof tierBadge === 'function' ? tierBadge(P.rating) : ''}</span>${N('elo', Math.round(P.rating))} <span data-glance-n="tier">${H(typeof eloTier === 'function' ? eloTier(P.rating)[0] : '')}</span></dd></div>`);
    if (P.ranked) { const pool = s.players.filter(x => x.ranked && x.pos === P.pos && isFinite(x.rating)), sorted = [...pool].sort((a, b) => a.rating === b.rating ? 0 : a.rating < b.rating ? 1 : -1);
      lines.push(`<div><dt>Rank</dt><dd>${N('rank', '#' + (sorted.indexOf(P) + 1))} <span class="glance-q">of <span data-glance-n="of">${sorted.length}</span> rated <span data-glance-n="posof">${H(POS[P.pos] || P.pos + 's')}</span></span></dd></div>`); }
    else { const why = P.team === 'FA' ? 'not on a roster' : !(P.min >= 10) ? `${(+P.min || 0).toFixed(0)} minutes a game, under the ladder's ten` : !(P.games >= 20) ? `${P.games || 0} games, under the ladder's twenty` : 'outside the ladder\'s pool';
      lines.push(`<div><dt>Rank</dt><dd class="glance-q" data-glance-n="norank">not ranked: ${H(why)}</dd></div>`); }
  } else lines.push(`<div><dt>Overall Elo</dt><dd class="glance-q" data-glance-n="noelo">no rating: he is not among the players the model rates</dd></div>`);
  /* the game */
  if (g) lines.push(`<div><dt>Game</dt><dd>${home == null ? '' : `<span data-glance-n="ha">${home ? 'vs' : 'at'}</span> <span data-glance-n="opp">${tag(opp)}</span> · `}<span data-glance-n="kick">${H(kickOf(g))}</span></dd></div>`);
  /* what he faces: the opponent's defence (or offence) as the Teams tab's column rates and ranks it */
  if (opp) { const key = L && AT_DEF.has(L.stat) ? 'offence' : 'defence', u = teamRank(key, opp), nm = key === 'offence' ? 'Offence' : 'Defence';
    if (u) lines.push(`<div data-glance-faces="${key}"><dt>Faces</dt><dd title="The Teams tab's ${nm} column: the ${H(nickOf(opp))}' ${key} in rating points, from the player model with today's injuries, ${ordinal(u.rank)} of the ${u.n} teams"><span data-glance-n="uclub">${tag(opp)}</span> <span data-glance-n="unit">${nm}</span> ${N('uval', signed0(u.v))} ranked ${N('urank', ordinal(u.rank))} <span class="glance-q">of <span data-glance-n="uof">${u.n}</span></span></dd></div>`); }
  /* the props model's projection for him in this game, on trial: his minutes, the leg's own stat, his main lines */
  let table = '';
  if (row) {
    const st = L && L.kind === 'prop' && L.stat ? L.stat : null, ks = STATS.map(x => x[0]);
    const want = st && !ks.includes(st) ? [...STATS, [st, (typeof PP_NAMES === 'object' && PP_NAMES[st]) || st]] : STATS;
    const val = k => { if (k === 'min') return isFinite(row[3]) ? (+row[3]).toFixed(0) : '–';
