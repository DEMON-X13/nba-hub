name: Odds history

# One-off and resumable: the market's closing lines on past games, read from ESPN's game summaries, for the
# backtest. Runs on demand and when its tool changes; a run stopped by its time budget is finished by the next.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First season (the year it ends)"
        type: string
        default: "2023"
      to:
        description: "Last season"
        type: string
        default: "2026"
  push:
    branches: [main]
    paths: ["tools/fetch_odds_hist.js"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read the closing lines from ESPN's game summaries
        run: node tools/fetch_odds_hist.js --from ${{ inputs.from || '2023' }} --to ${{ inputs.to || '2026' }} --budget 100
      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name "nba-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/odds_hist.csv data/sample_pickcenter.json data/sample_core_odds.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "odds history: $(date -u +'%Y-%m-%d %H:%M UTC')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
