<script>
'use strict';
/* ---------- Suggested Parlays (README "Suggested Parlays") ----------
   One set a night, across every game of the night (the owner's call of 7 November 2026: "I want there to always be
   suggested [parlays]. i want the med [parlay] to be at least $4 outcome from 1$ and aggressive to be $8 or more. I want
   the best possible model confidence to match what level bet"). Until that day each game on national TV had a set of
   its own, Safe the likeliest pair and Medium and Aggressive the 3- and 4-leg parlays with the best expected return over
   25% and 12%, on that one game's legs; once the props model's trial was stopped as a FAIL on 5 November 2026 a set took
   team legs only, one side and one total a game, so a game made 2 legs at most and Medium and Aggressive could never
   fill (README "Suggested Parlays", "Before 7 November"). Now:
   - the night: the first Eastern date with a game still to tip (never preseason), every game of it, up from 6:00 AM
     Eastern that morning (a wait line before it), locked 2 hours before the night's first tip-off, and once locked held
     so though ESPN moves that tip-off later (spLockOf); from the first tip-off each level keeps its Add, Add to builder
     and Finish while all its games are still to tip (spOpen), and loses them once one has tipped;
   - the pool: every DraftKings-priced team leg of the night's games still to tip (moneyline, spread, total), priced
     exactly as the Parlay Builder takes them (lines.json via pbGl, or a newer Refresh odds read), each at the builder's
     own chance (legModel: a moneyline's and a spread's the model's, a total's DraftKings' own fair chance), held to the
     builder's band (45% to 97%), its far-off guard (none 15 points or more over DraftKings' fair chance) and its betslip
     id rule, with no value bar; and since the owner's call of 7 November 2026 ("Add at DraftKings' odds") every player's
     main line DraftKings has posted (lines.json's props.mains, or a newer Refresh odds read: pbPr), over and under with
     both prices on file, on a stat the page offers, at DraftKings' own fair chance (legFair: the whole margin on the
     Over), never the props model's (its FAIL stands: a player leg carries no model claim and no edge). By that rule an
     Under's fair chance is exactly one over its price, and an Over carries the whole margin (about $0.88 back on $1 at
     that chance on the 7 November lines); the levels, the likeliest at their price, so take short-priced Unders and
     almost never an Over. That is a rule, not a return: on this season's graded lines an Under lost about 1.65% a dollar
     at that chance and an Over about 11.3% (research/sp_ruler). The card's chance line says so in its title. In the same
     band, on a player the props model places on one of the game's clubs and whom the report does not list (spOutWhy, the
     Parlay Builder's pbHeldWhy: Out, Doubtful, Questionable, Day-To-Day; a probable player plays); no milestone, Yes
     market or line priced on one side, or with no margin;
   - the levels, each chosen on the chance every leg lands by the builder's own sums (parlayProb with the same-game
     copula at each leg's chance: a team leg's the model's, a player leg's DraftKings' fair chance; parlayDec the price, a
     game's legs priced together), since the owner's call of 8 November 2026 with no leg limit: Safe the likeliest parlay
     of 2 legs or more paying $2 or more on $1 (a decimal price of 2.00 or more; his choice of floor, Safe having had none
     as the likeliest pair); Medium $4 or more; Aggressive $8 or more (until then Safe 2 legs and the others 2 to 5); at
     most one side
     (the moneyline or the spread), one total and one leg a player a game (spFits); ties to the higher price, then the
     fewer legs, then the legs' ids; and since the owner's call of 10 November 2026 ("why is it still only showing team
     legs and not players") each level holds at least one player leg wherever the night's legs make such a parlay, else
     it is the likeliest without one and says why in its rule's words ("no player lines yet", "no player leg fits"). The
     search is exact with a thousand player legs a night (spWalk, under THE SEARCH: a branch and bound on properties of
     the copula that never cuts a parlay the rule could rank first);
   - after the lock and before the first tip-off, a level holding a player the report has listed since is built again
     from the lines at hand, that level alone (spRebuild), said in one line under it: the record's replacement where the
     job made one, else this page's own, kept beside the set (nba_sp_lock_v1's rep);
   - the record is the job's (tools/suggest_ledger.js, data/suggest_ledger.json, its `night` map), read no-store when the
     tab first opens and again at a lock; the job takes no set of a night DraftKings has posted no line for, and the page
     reads one such (spNoLines) as no set, building its own from the lock; the `featured` map, the per-game sets before 7
     November, stays as it was taken and graded, and the pills count the night map alone, each titled with the old
     rule's record.
   Nothing is read before the tab opens; nothing is stored but nba_sp_lock_v1, a locked set the page built itself and
   any level it built again after the lock. */
const SP_LOCK_H = 2, SP_LOCK_MS = SP_LOCK_H * 3600e3, SP_OPEN_H = 6;
/* the night's three levels: [id, label, the fewest legs, the most legs (null: no limit), the least decimal price]
   (tools/suggest_check.js keeps its own copy, and the job refuses a page whose levels are not these). Since the owner's
   call of 8 November 2026 ("we can eliminate maximum legs for all the sections ... as long as it meets the criteria of
   safe, med, aggressive and meets min payout requirements") a level has no leg limit, and Safe a floor of its own, $2 on
   $1 (+100), his choice: until then Safe was the likeliest 2-leg parlay with no floor and Medium and Aggressive took 2 to
   5 legs (SP_OLD_LEVELS, the levels a set taken before then keeps on the tab).
   WITH A PLAYER (the owner's call of 10 November 2026, a screenshot of that night's levels, every one team legs alone:
   "why is it still only showing team legs and not players"): a team leg stands on the model's chance, which runs over
   DraftKings', and a player leg on DraftKings' own fair chance, so at the same price a team leg always looked likelier
   and the levels took none. So each level is now the likeliest parlay of 2 legs or more, no most, paying its floor, that
   holds at least one player leg, wherever the night's pool makes one; where it makes none (DraftKings has posted no
   player line, or none can make the level), the likeliest without one, the rule before, so a level is never empty for
   want of a player. The sixth field, 'player', says so (a level's head carries it as need: 'player'); a set taken from 8
   November 2026 until then keeps the rule it was taken under (SP_NOCAP_LEVELS, no need) */
const SP_LEVELS = [['safe', 'Safe', 2, null, 2, 'player'], ['med', 'Medium', 2, null, 4, 'player'], ['aggr', 'Aggressive', 2, null, 8, 'player']];
const SP_NOCAP_LEVELS = [['safe', 'Safe', 2, null, 2], ['med', 'Medium', 2, null, 4], ['aggr', 'Aggressive', 2, null, 8]];
const SP_OLD_LEVELS = [['safe', 'Safe', 2, 2, 0], ['med', 'Medium', 2, 5, 4], ['aggr', 'Aggressive', 2, 5, 8]];
const SP_RULE = { safe: 'likeliest paying $2+', med: 'likeliest paying $4+', aggr: 'likeliest paying $8+' };
/* a level's rule in words, from its floor (a set taken before 8 November 2026 keeps its own: Safe "likeliest pair"), and
   its title: no leg limit, and what more legs on favourites cost (on the per-game record the model's expected wins ran
   about twice DraftKings' fair chance's: Medium 3.9 to 2.0, Aggressive 2.0 to 0.7, over fourteen sets). On the rule with
   a player (need 'player') the words say which way the level went: "with a player", or, where the pool made no parlay
   with one, why in a few words (nopl: SP_NOPL's lines, no player line read for the night's games; fit, none that makes
   the level) */
const SP_NOPL = { lines: 'no player lines yet', fit: 'no player leg fits' };
const spRuleOf = (id, F, need, nopl) => !F ? 'likeliest pair' : !need ? `likeliest paying $${F}+` : nopl ? `likeliest paying $${F}+ · ${SP_NOPL[nopl] || SP_NOPL.fit}` : `likeliest paying $${F}+ with a player`;
const spRuleTitle = (F, hi, need) => hi != null ? '' : need ? `No leg limit: the likeliest parlay of the night’s legs (team legs at the model’s chance, player legs at DraftKings’ fair chance) that pays $${F} or more on $1 and holds at least one player leg, wherever the night’s legs make one; where they make none, the likeliest without one. More legs on favourites stack the model’s overconfidence on team legs: on the record its expected wins ran about twice DraftKings’.` : `No leg limit: the likeliest parlay of the night’s legs that pays $${F} or more on $1. More legs on favourites stack the model’s overconfidence on team legs: on the record its expected wins ran about twice DraftKings’.`;
/* the day the night rule began, for the pills' titles: the record before it is the per-game rule's */
const SP_NIGHT_FROM = '7 Nov';
/* two chances or prices within this are level (a product worked in another order differs in its last bits); a price
   floor is met within SP_FLOOR_EPS */
const SP_TIE = 1e-12, SP_FLOOR_EPS = 1e-9;
const SP_KEEP_KEY = 'nba_sp_lock_v1', SP_KEEP_V = 2, SP_REC_URL = 'data/suggest_ledger.json';
let SP_CACHE = new Map(), SP_IN = new Map(), SP_SHOWN = null, SP_ASKED = false, SP_SAID = '';
let SP_REC = null, SP_REC_DONE = false, SP_REC_STATE = null, SP_REC_BUSY = false, SP_KEEP = null;
const spIsMap = v => !!v && typeof v === 'object' && !Array.isArray(v);
const spR = (v, d) => v == null || !isFinite(v) ? null : Math.round(v * d) / d;
/* an instant as the record writes it, to the minute as the slate writes a tip-off ("2026-10-27T23:30Z") */
const spMin = ms => new Date(ms).toISOString().slice(0, 16) + 'Z';
const spIso = ms => new Date(ms).toISOString().slice(0, 19) + 'Z';

/* ---------- which night ---------- */
const spPlays = g => !!g && g.type !== 'PRE' && typeof g.date === 'string' && typeof g.tip === 'string' && Number.isFinite(Date.parse(g.tip));
const spToTip = g => spPlays(g) && g.status === 'scheduled' && !started(g);
const spNid = d => `${S.season}_${String(d).replace(/-/g, '')}_NIGHT`;
/* the night of an Eastern date: every game of it but preseason, in tip-off order (one tip-off's games in the slate's own
   order), its first and last tip-off and the instant its set goes up, 6:00 AM Eastern that morning */
function spNightOf(date) {
  if (!S || !S.slate || typeof date !== 'string') return null;
  const games = S.slate.map((g, i) => [g, i]).filter(([g]) => spPlays(g) && g.date === date)
    .sort((a, b) => Date.parse(a[0].tip) - Date.parse(b[0].tip) || a[1] - b[1]).map(x => x[0]);
  if (!games.length) return null;
  const last = games.reduce((m, g) => Date.parse(g.tip) > Date.parse(m.tip) ? g : m, games[0]);
  return { id: spNid(date), date, games, tip: games[0].tip, last: last.tip, open: spEtAt(date, SP_OPEN_H) };
}
function spById(id) { const m = /^\d{4}_(\d{4})(\d{2})(\d{2})_NIGHT$/.exec(String(id || '')); if (!m) return null; const N = spNightOf(`${m[1]}-${m[2]}-${m[3]}`); return N && N.id === id ? N : null; }
/* THE night: the first Eastern date with a game still to tip, never preseason; up from 6:00 AM Eastern that morning */
function spNight() {
  const G = (S && S.slate ? S.slate : []).filter(spToTip).sort((a, b) => Date.parse(a.tip) - Date.parse(b.tip));
  if (!G.length) return null;
  const N = spNightOf(G[0].date); return N ? { ...N, up: N.open == null || Date.now() >= N.open } : null;
}
/* the one place the tab asks which night it sets out */
function spOn() { const N = spNight(); return N && N.up ? N : null; }
/* the nights the record takes: those of the lines feed's two dates (pbDates), the dates the job reads DraftKings' lines
   for, so a set is taken a night ahead (the job's runs land hours late) */
function spTakes() { return pbDates().map(spNightOf).filter(Boolean); }
function spLockAt(N) { const t = N && N.tip ? Date.parse(N.tip) : NaN; return Number.isFinite(t) ? t - SP_LOCK_MS : null; }
/* the instant the night locked, or locks: its first tip-off less 2 hours, or earlier, once it has passed, the lock of a
   set the record or this browser keeps of it, taken at a first tip-off ESPN has moved since. A night once locked stays
   locked (the job takes no new set of it either: tools/suggest_ledger.js), so a first tip-off moved later after the
   lock never sets the night out live again on later lines */
function spLockOf(N, now) {
  let lk = spLockAt(N); if (lk == null) return null;
  const P = SP_REC && spIsMap(SP_REC.night) ? SP_REC.night : {};
  for (const x of Object.values(P)) if (spRecMine(x, N)) { const l = Date.parse(x.tip) - SP_LOCK_MS; if (l <= now && l < lk) lk = l; }
  const k = spKeep()[N.id]; if (k && typeof k.tip === 'string' && Number.isFinite(Date.parse(k.tip))) { const l = Date.parse(k.tip) - SP_LOCK_MS; if (l <= now && l < lk) lk = l; }
  return lk;
}
/* where the night stands: w waiting for its morning, l live, k locked, u under way (its first game tipped) */
function spPhase(N, now) {
  if (!N) return 'none'; if (N.open != null && now < N.open) return 'w';
  const lk = spLockOf(N, now); return now < lk ? 'l' : now < Date.parse(N.tip) ? 'k' : 'u';
}
/* a time in US Eastern, as the slate's dates are ("Tue 5:30 PM ET") */
function spEt(ms, day) { try { return new Date(ms).toLocaleString('en-US', { timeZone: 'America/New_York', ...(day ? { weekday: 'short' } : {}), hour: 'numeric', minute: '2-digit' }) + ' ET'; } catch (e) { return spMin(ms).slice(11, 16) + ' UTC'; } }
/* the instant of h:00 in New York on an Eastern date, through the time zone database (the page has no offset table): the
   offset whose instant reads back as that hour of that date */
const SP_NYF = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
function spEtAt(day, h) {
  const naive = Date.parse(`${day}T${String(h).padStart(2, '0')}:00:00Z`); if (!Number.isFinite(naive)) return null;
  for (const off of [4, 5]) { const t = naive + off * 3600e3, p = Object.fromEntries(SP_NYF.formatToParts(new Date(t)).map(x => [x.type, x.value]));
    if (`${p.year}-${p.month}-${p.day}` === day && +p.hour === h) return t; }
  return naive + 5 * 3600e3;
}
const spWeekday = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', timeZone: 'UTC' });
/* where the night stands, as the record's watch reads it (its morning, its lock, its first tip-off each move it) */
function spRecState() { const N = spNight(); return N ? `${N.id}@${N.tip}:${spPhase(N, Date.now())}` : 'none'; }
/* what the tab stands on beyond the data: that, and how many of the night's games are still to tip (a tip-off under way
   takes the Adds off the levels holding its legs, so the tab is drawn again) */
function spState() { const N = spNight(); return N ? `${spRecState()}|${N.games.filter(spToTip).length}|${spRulerOn() ? 'r' + spFiltKey(spEff(spUi(), N)) : ''}` : 'none'; }

/* ---------- the pool: every team leg and every player's main line of the night's games still to tip ----------
   Team legs (pbPriced's moneylines and spreads, pbTotals' totals) at DraftKings' prices as the Parlay Builder takes them
   and at the builder's own chance (legModel), each held to the builder's band, its far-off guard and its betslip id rule
   (a game line with no id where its game's lines carry ids), and no value bar; a leg 3 points over its price is still
   marked Value (thin false), a total never.
   Player legs (the owner's call of 7 November 2026, asked "why is it not showing player parlays": "Add at DraftKings'
   odds"): every player's main line DraftKings has posted for the night's games (lines.json's props.mains, or a newer
   Refresh odds read, as the Parlay Builder reads them: pbPr), over and under, on a stat the page offers (PROP_STATS),
   with both prices on file, on a player the props model projects in that game on one of its two clubs (pbWho) whom the
   injury report does not list (spOutWhy: the game's out lists, or any listing on today's report, Day-To-Day among them, a
   probable player playing), each at DraftKings' own fair chance as the page's rule gives it (legFair: a main line's whole
   margin on the Over), never the props model's, held to the same band. No milestone, no Yes market (a double- or
   triple-double), nothing priced on one side or estimated. A player leg carries no edge (the props model failed its
   trial twice: README "Player props"), so it is never marked Value; its props model chance rides along (pm) for the
   matchup bubble alone, which draws it muted, as the builder does.
   A line DraftKings priced with no margin (its two implied chances summing under 1: none on the 25,819 archived main lines
   or in lines.json, the least 1.005) is left out, a player's main line and a game's total alike, and counted (vig): there
   the fair Over, or the total's fair chance, would read over its own price, and THE SEARCH below stands on no leg but a
   side being so (the review of 7 November 2026) */
function spOutWhy(pid, gid) { return pbHeldWhy(pid, gid); }
function spPool(N) {
  const games = N.games.filter(spToTip), legs = []; let band = 0, far = 0, noId = 0, vig = 0;
  const pl = { lines: 0, band: 0, held: 0, none: 0, vig: 0 }, noVig = (a, b) => propImplied(a) + propImplied(b) < 1;
  const keep = (c, total) => {
    if (!Number.isFinite(c.price) || c.price === 0 || c.p == null || !Number.isFinite(c.p)) return;
    if (total && Number.isFinite(c.other) && c.other && noVig(c.price, c.other)) { vig++; return; }
    if (!(c.p >= PB_PMIN && c.p < PB_PMAX)) { band++; return; }
    if (legFarOff(c)) { far++; return; }
    if (c.dkOn && !c.dk) { noId++; return; }
    legs.push(total ? { ...c, thin: false, market: true } : { ...c, thin: pbEdge(c) < PB_EDGE - 1e-12 });
  };
  for (const c of pbPriced(games)) if (c.kind === 'ml' || c.kind === 'spread') keep(c, false);
  for (const g of games) for (const c of pbTotals(g)) keep(c, true);
  for (const g of games) {
    const pr = pbPr(g.id); if (!pr || !Array.isArray(pr.mains)) continue;
    const base = { id: g.id, away: g.away, home: g.home, date: g.date, tip: g.tip };
    for (const m of pr.mains) {
      if (!m || !PROP_STATS.includes(m.stat) || !Number.isFinite(m.line) || !Number.isFinite(m.over) || !Number.isFinite(m.under) || !m.over || !m.under) continue;
      const w = pbWho(g, m.player);
      if (!w) { pl.none += 2; continue; }
      if (spOutWhy(m.player, g.id)) { pl.held += 2; continue; }
      if (noVig(m.over, m.under)) { pl.vig += 2; continue; }
      for (const side of ['over', 'under']) {
        pl.lines++;
        const v = pbView({ ...base, kind: 'prop', pid: m.player, name: w.name, team: w.team, at: pr.at, stat: m.stat, mk: 'main', line: m.line, side, odds: side === 'over' ? m.over : m.under, other: side === 'over' ? m.under : m.over });
        const f = legFair(v); if (!f || f.est || !(f.p > 0 && f.p < 1)) { pl.band++; continue; }
        if (!(f.p >= PB_PMIN && f.p < PB_PMAX)) { pl.band++; continue; }
        legs.push({ ...v, pm: v.p, p: f.p, thin: true, pl: true });
      }
    }
  }
  legs.sort(pbOrd);
  return { games, legs, band, far, noId, vig, pl };
}
/* a is better than b by a level's rule: the likelier, then the higher price, then the fewer legs, then the legs' ids */
function spBetter(a, b) {
  if (!b) return true;
  if (a.p > b.p + SP_TIE) return true; if (b.p > a.p + SP_TIE) return false;
  if (a.d > b.d + SP_TIE) return true; if (b.d > a.d + SP_TIE) return false;
  if (a.n !== b.n) return a.n < b.n;
  return a.ids < b.ids;
}

/* ---------- THE SEARCH: each level the exact best of every parlay the pool makes, with no leg limit ----------
   The owner's call of 8 November 2026: "we can eliminate maximum legs for all the sections, it can be multiple legs as
   long as it meets the criteria of safe, med, aggressive and meets min payout requirements" (Safe's floor $2 on $1, +100,
   his choice). A parlay is a set of legs of any size from 2, one leg a player, one side (the moneyline or the spread) and
   one total a game; its chance and its price are the products of its games' own (parlayProb and slipDec work game by
   game): a game's one leg at its chance and price, its two or more together at the builder's same-game sums (the gaussian
   copula at data/corr.json's rho, R: two legs exactly by joint2, more by the GHK sum; the price min(the prices multiplied,
   HOLD over their implied joint chance J)). A level is the likeliest parlay whose price meets its floor F. With a
   thousand player legs a night and no leg limit the parlays are far too many to list, so the search is a branch and bound
   that leaves only what it proves cannot rank first.
   THE INVARIANT (the review of 8 November 2026): every bound below on two or three or more legs of a game stands on the
