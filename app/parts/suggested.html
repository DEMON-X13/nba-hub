<script>
'use strict';
/* ---------- Suggested Parlays (README "Suggested Parlays") ----------
   One set a night, across every game of the night (the owner's call of 7 November 2026: "I want there to always be
   suggested [parlays]. i want the med [parlay] to be at least $4 outcome from 1$ and aggressive to be $8 or more. I want
   the best possible model confidence to match what level bet"). Until that day each game on national TV had a set of
   its own, Safe the likeliest pair and Medium and Aggressive the 3- and 4-leg parlays with the best expected return over
   25% and 12%, on that one game's legs; once the props model's trial was stopped as a FAIL on 5 November 2026 a set took
   team legs only, one side and one total a game, so a game made 2 legs at most and Medium and Aggressive could never
   fill (README "Suggested Parlays", "Before 7 November"). Now:
   - the night: the first Eastern date with a game still to tip (never preseason), every game of it, up from 6:00 AM
     Eastern that morning (a wait line before it), locked 2 hours before the night's first tip-off, and once locked held
     so though ESPN moves that tip-off later (spLockOf); from the first tip-off each level keeps its Add, Add to builder
     and Finish while all its games are still to tip (spOpen), and loses them once one has tipped;
   - the pool: every DraftKings-priced team leg of the night's games still to tip (moneyline, spread, total), priced
     exactly as the Parlay Builder takes them (lines.json via pbGl, or a newer Refresh odds read), each at the builder's
     own chance (legModel: a moneyline's and a spread's the model's, a total's DraftKings' own fair chance), held to the
     builder's band (45% to 97%), its far-off guard (none 15 points or more over DraftKings' fair chance) and its betslip
     id rule, with no value bar; no player legs (the FAIL stands);
   - the levels, each chosen on the model's chance every leg lands by the builder's own sums (parlayProb with the
     same-game copula, parlayDec the price, a game's two legs priced together): Safe the likeliest 2-leg parlay; Medium the
     likeliest of 2 to 5 legs paying $4 or more on $1 (a decimal price of 4.00 or more); Aggressive the likeliest of 2 to 5
     legs paying $8 or more; at most one side (the moneyline or the spread) and one total a game (pbFits); ties to the
     higher price, then the fewer legs, then the legs' ids. The search is exact (spSearch): a parlay's chance and price are
     the products of its games' own, so it walks the games, each one's options (a side, a total, or both, worked by the
     builder's sums) likeliest first, and drops a branch once its chance is under the best found (each leg can only lower
     it) or its price cannot reach the level's floor;
   - the record is the job's (tools/suggest_ledger.js, data/suggest_ledger.json, its `night` map), read no-store when the
     tab first opens and again at a lock; the job takes no set of a night DraftKings has posted no line for, and the page
     reads one such (spNoLines) as no set, building its own from the lock; the `featured` map, the per-game sets before 7
     November, stays as it was taken and graded, and the pills count the night map alone, each titled with the old
     rule's record.
   Nothing is read before the tab opens; nothing is stored but nba_sp_lock_v1, a locked set the page built itself. */
const SP_LOCK_H = 2, SP_LOCK_MS = SP_LOCK_H * 3600e3, SP_OPEN_H = 6;
/* the night's three levels: [id, label, the fewest legs, the most legs, the least decimal price] (tools/suggest_check.js
   keeps its own copy, and the job refuses a page whose levels are not these) */
const SP_LEVELS = [['safe', 'Safe', 2, 2, 0], ['med', 'Medium', 2, 5, 4], ['aggr', 'Aggressive', 2, 5, 8]];
const SP_RULE = { safe: 'likeliest pair', med: 'likeliest paying $4+', aggr: 'likeliest paying $8+' };
/* the day the night rule began, for the pills' titles: the record before it is the per-game rule's */
const SP_NIGHT_FROM = '7 Nov';
/* two chances or prices within this are level (a product worked in another order differs in its last bits); a price
   floor is met within SP_FLOOR_EPS */
const SP_TIE = 1e-12, SP_FLOOR_EPS = 1e-9;
const SP_KEEP_KEY = 'nba_sp_lock_v1', SP_KEEP_V = 2, SP_REC_URL = 'data/suggest_ledger.json';
let SP_CACHE = new Map(), SP_IN = new Map(), SP_SHOWN = null, SP_ASKED = false, SP_SAID = '';
let SP_REC = null, SP_REC_DONE = false, SP_REC_STATE = null, SP_REC_BUSY = false, SP_KEEP = null;
const spIsMap = v => !!v && typeof v === 'object' && !Array.isArray(v);
const spR = (v, d) => v == null || !isFinite(v) ? null : Math.round(v * d) / d;
/* an instant as the record writes it, to the minute as the slate writes a tip-off ("2026-10-27T23:30Z") */
const spMin = ms => new Date(ms).toISOString().slice(0, 16) + 'Z';
const spIso = ms => new Date(ms).toISOString().slice(0, 19) + 'Z';

/* ---------- which night ---------- */
const spPlays = g => !!g && g.type !== 'PRE' && typeof g.date === 'string' && typeof g.tip === 'string' && Number.isFinite(Date.parse(g.tip));
const spToTip = g => spPlays(g) && g.status === 'scheduled' && !started(g);
const spNid = d => `${S.season}_${String(d).replace(/-/g, '')}_NIGHT`;
/* the night of an Eastern date: every game of it but preseason, in tip-off order (one tip-off's games in the slate's own
   order), its first and last tip-off and the instant its set goes up, 6:00 AM Eastern that morning */
function spNightOf(date) {
  if (!S || !S.slate || typeof date !== 'string') return null;
  const games = S.slate.map((g, i) => [g, i]).filter(([g]) => spPlays(g) && g.date === date)
    .sort((a, b) => Date.parse(a[0].tip) - Date.parse(b[0].tip) || a[1] - b[1]).map(x => x[0]);
  if (!games.length) return null;
  const last = games.reduce((m, g) => Date.parse(g.tip) > Date.parse(m.tip) ? g : m, games[0]);
  return { id: spNid(date), date, games, tip: games[0].tip, last: last.tip, open: spEtAt(date, SP_OPEN_H) };
}
function spById(id) { const m = /^\d{4}_(\d{4})(\d{2})(\d{2})_NIGHT$/.exec(String(id || '')); if (!m) return null; const N = spNightOf(`${m[1]}-${m[2]}-${m[3]}`); return N && N.id === id ? N : null; }
/* THE night: the first Eastern date with a game still to tip, never preseason; up from 6:00 AM Eastern that morning */
function spNight() {
  const G = (S && S.slate ? S.slate : []).filter(spToTip).sort((a, b) => Date.parse(a.tip) - Date.parse(b.tip));
  if (!G.length) return null;
  const N = spNightOf(G[0].date); return N ? { ...N, up: N.open == null || Date.now() >= N.open } : null;
}
/* the one place the tab asks which night it sets out */
function spOn() { const N = spNight(); return N && N.up ? N : null; }
/* the nights the record takes: those of the lines feed's two dates (pbDates), the dates the job reads DraftKings' lines
   for, so a set is taken a night ahead (the job's runs land hours late) */
function spTakes() { return pbDates().map(spNightOf).filter(Boolean); }
function spLockAt(N) { const t = N && N.tip ? Date.parse(N.tip) : NaN; return Number.isFinite(t) ? t - SP_LOCK_MS : null; }
/* the instant the night locked, or locks: its first tip-off less 2 hours, or earlier, once it has passed, the lock of a
   set the record or this browser keeps of it, taken at a first tip-off ESPN has moved since. A night once locked stays
   locked (the job takes no new set of it either: tools/suggest_ledger.js), so a first tip-off moved later after the
   lock never sets the night out live again on later lines */
function spLockOf(N, now) {
  let lk = spLockAt(N); if (lk == null) return null;
  const P = SP_REC && spIsMap(SP_REC.night) ? SP_REC.night : {};
  for (const x of Object.values(P)) if (spRecMine(x, N)) { const l = Date.parse(x.tip) - SP_LOCK_MS; if (l <= now && l < lk) lk = l; }
  const k = spKeep()[N.id]; if (k && typeof k.tip === 'string' && Number.isFinite(Date.parse(k.tip))) { const l = Date.parse(k.tip) - SP_LOCK_MS; if (l <= now && l < lk) lk = l; }
  return lk;
}
/* where the night stands: w waiting for its morning, l live, k locked, u under way (its first game tipped) */
function spPhase(N, now) {
  if (!N) return 'none'; if (N.open != null && now < N.open) return 'w';
  const lk = spLockOf(N, now); return now < lk ? 'l' : now < Date.parse(N.tip) ? 'k' : 'u';
}
/* a time in US Eastern, as the slate's dates are ("Tue 5:30 PM ET") */
function spEt(ms, day) { try { return new Date(ms).toLocaleString('en-US', { timeZone: 'America/New_York', ...(day ? { weekday: 'short' } : {}), hour: 'numeric', minute: '2-digit' }) + ' ET'; } catch (e) { return spMin(ms).slice(11, 16) + ' UTC'; } }
/* the instant of h:00 in New York on an Eastern date, through the time zone database (the page has no offset table): the
   offset whose instant reads back as that hour of that date */
const SP_NYF = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
function spEtAt(day, h) {
  const naive = Date.parse(`${day}T${String(h).padStart(2, '0')}:00:00Z`); if (!Number.isFinite(naive)) return null;
  for (const off of [4, 5]) { const t = naive + off * 3600e3, p = Object.fromEntries(SP_NYF.formatToParts(new Date(t)).map(x => [x.type, x.value]));
    if (`${p.year}-${p.month}-${p.day}` === day && +p.hour === h) return t; }
  return naive + 5 * 3600e3;
}
const spWeekday = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', timeZone: 'UTC' });
/* where the night stands, as the record's watch reads it (its morning, its lock, its first tip-off each move it) */
function spRecState() { const N = spNight(); return N ? `${N.id}@${N.tip}:${spPhase(N, Date.now())}` : 'none'; }
/* what the tab stands on beyond the data: that, and how many of the night's games are still to tip (a tip-off under way
   takes the Adds off the levels holding its legs, so the tab is drawn again) */
function spState() { const N = spNight(); return N ? `${spRecState()}|${N.games.filter(spToTip).length}` : 'none'; }

/* ---------- the pool: every team leg of the night's games still to tip ----------
   pbPriced's moneylines and spreads and pbTotals' totals, at DraftKings' prices as the Parlay Builder takes them and at
   the builder's own chance (legModel), each held to the builder's band, its far-off guard and its betslip id rule (a game
   line with no id where its game's lines carry ids), and no value bar. A leg 3 points over its price is still marked
   Value (thin false), a total never. No player leg: the props model's trial was stopped as a FAIL */
function spPool(N) {
  const games = N.games.filter(spToTip), legs = []; let band = 0, far = 0, noId = 0;
  const keep = (c, total) => {
    if (!Number.isFinite(c.price) || c.price === 0 || c.p == null || !Number.isFinite(c.p)) return;
    if (!(c.p >= PB_PMIN && c.p < PB_PMAX)) { band++; return; }
    if (legFarOff(c)) { far++; return; }
    if (c.dkOn && !c.dk) { noId++; return; }
    legs.push(total ? { ...c, thin: false, market: true } : { ...c, thin: pbEdge(c) < PB_EDGE - 1e-12 });
  };
  for (const c of pbPriced(games)) if (c.kind === 'ml' || c.kind === 'spread') keep(c, false);
  for (const g of games) for (const c of pbTotals(g)) keep(c, true);
  legs.sort(pbOrd);
  return { games, legs, band, far, noId };
}
/* each game's options, likeliest first: a side, a total, or a side and the total together, each one's chance and price by
   the builder's own sums on just those legs (a parlay's are the products of its games' own: parlayProb and slipDec work
   game by game). Without the same-game table a game gives one leg, as the builder takes no second (slipWhy) */
function spOpts(pool) {
  const pairs = !!(S.corr && S.corr.rho && S.corr.hold), by = new Map();
  for (const l of pool.legs) { if (!by.has(l.gid)) by.set(l.gid, { side: [], total: [] }); by.get(l.gid)[l.kind === 'total' ? 'total' : 'side'].push(l); }
  return [...by.entries()].map(([gid, x]) => {
    const opts = [...x.side, ...x.total].map(l => ({ legs: [l], p: l.p, d: amToDec(l.price) }));
    if (pairs) for (const a of x.side) for (const b of x.total) {
      if (slipWhy([pbSlipOf(a)], pbSlipOf(b))) continue;
      const L = [a, b], p = parlayProb(L).corr, d = parlayDec(L.map(l => ({ leg: l, ml: l.price })));
      if (p > 0 && d > 1) opts.push({ legs: L, p, d }); }
    opts.sort((a, b) => (b.p - a.p) || (b.d - a.d) || (a.legs.length - b.legs.length) || (a.legs.map(l => l.sk).join() < b.legs.map(l => l.sk).join() ? -1 : 1));
    return { gid, opts, top: Math.max(1, ...opts.filter(o => o.legs.length === 1).map(o => o.d)) };
  });
}
/* a is better than b by a level's rule: the likelier, then the higher price, then the fewer legs, then the legs' ids */
function spBetter(a, b) {
  if (!b) return true;
  if (a.p > b.p + SP_TIE) return true; if (b.p > a.p + SP_TIE) return false;
  if (a.d > b.d + SP_TIE) return true; if (b.d > a.d + SP_TIE) return false;
  if (a.n !== b.n) return a.n < b.n;
  return a.ids < b.ids;
}
/* the level's parlay, exactly: every choice of games and of one option a game, of lo to hi legs, at the floor F or over,
   walked game by game, a branch dropped once its chance is under the best found (each leg lowers it: a joint chance is
   never above a leg's own) or its price, at the dearest leg left for every leg it may still take, cannot reach F */
function spSearch(G, lv) {
  const [, , lo, hi, F] = lv, n0 = G.length, suf = new Array(n0 + 1).fill(1);
  for (let i = n0 - 1; i >= 0; i--) suf[i] = Math.max(suf[i + 1], G[i].top);
  let best = null; const pick = [];
  const visit = (i, p, d, n) => {
    if (n >= lo && d >= F - SP_FLOOR_EPS && (!best || p >= best.p - SP_TIE)) {
      const legs = pick.flatMap(o => o.legs), c = { p, d, n, ids: legs.map(l => l.sk).sort().join(','), legs };
      if (spBetter(c, best)) best = c; }
    if (n >= hi || (F && d * Math.pow(suf[i], hi - n) < F - SP_FLOOR_EPS)) return;
    for (let j = i; j < n0; j++) for (const o of G[j].opts) {
      const q = p * o.p; if (best && q < best.p - SP_TIE) break;
      if (n + o.legs.length > hi) continue;
      pick.push(o); visit(j + 1, q, d * o.d, n + o.legs.length); pick.pop();
    }
  };
  visit(0, 1, 1, 0);
  return best;
}
/* a level's head, its parlay or why it has none */
const spHead = ([id, label, lo, hi, F]) => ({ id, label, min: lo, max: hi, price: F, rule: SP_RULE[id] });
function spWhy([, , lo, , F], pool, N) {
  if (!pool.games.length) return 'No game of the night is still to tip.';
  if (!pool.legs.length) {
    /* when the lines feed (or a press) last read the night's games, posted or not */
    const at = N.games.flatMap(g => [LINES && LINES.games && LINES.games[g.id] ? LINES.games[g.id].at : null, SG_LINES[g.id] ? SG_LINES[g.id].at : null]).filter(x => Number.isFinite(Date.parse(x))).sort().pop();
    if (!N.games.some(g => pbHasGl(g.id))) return at ? `No legs yet: DraftKings had posted no game lines for the night’s games as of ${spEt(Date.parse(at), true)}.` : 'No legs yet: no DraftKings line has been read for the night’s games.';
    return 'No leg of the night is in the builder’s range: 45% to 97% by the model, and not far off DraftKings.';
  }
  const by = new Map(); for (const l of pool.legs) by.set(l.gid + (l.kind === 'total' ? '|t' : '|s'), 1);
  const m = by.size;
  if (m < lo) return `Only ${m} leg${m === 1 ? '' : 's'} tonight: a parlay takes one side and one total a game.`;
  if (F) return `No parlay of the night’s legs pays $${F} or more on $1${pool.games.length === 1 ? ': one game makes 2 legs at most' : ''}.`;
  return 'No parlay of the night’s legs that the builder takes.';
}
/* a level's legs one by one as the builder takes them (slipWhy, the NBA's same-game refusals): pbFits's rules are those
   refusals on team legs, so this never refuses; it is the guarantee that a level is a parlay the builder takes */
function spSlipOk(legs) { const have = []; for (const l of legs) { const s = pbSlipOf(l); if (slipWhy(have, s)) return false; have.push(s); } return true; }
const SP_NO_TABLE = 'The same-game table is not in the published file, so a game’s two legs cannot be priced together.';
function spLevel(G, pool, lv, N) {
  const head = spHead(lv), r = spSearch(G, lv);
  if (!r) return { ...head, why: spWhy(lv, pool, N) + (!(S.corr && S.corr.rho && S.corr.hold) && pool.legs.length ? ' ' + SP_NO_TABLE : '') };
  const x = pbExact(r.legs);
  if (!spSlipOk(x.legs)) return { ...head, why: 'No parlay of the night’s legs that the builder’s same-game rules take.' };
  return { ...head, ...x, fair: parlayFair(x.legs) };
}
function spBuild(N) {
  const pool = spPool(N), G = spOpts(pool);
  return { id: N.id, tiers: SP_LEVELS.map(lv => spLevel(G, pool, lv, N)), pool, G };
}
/* a night's live set, the same for the same data (the search and the sums are deterministic), from the cache while
   nothing it stands on has moved: its first tip-off, which of its games are still to tip and pbDataSig (the publish,
   lines.json, a press's reads) */
const spSig = N => [N.id, N.tip, N.games.filter(spToTip).map(g => g.id).join('+'), pbDataSig()].join('|');
function spSet(id) {
  const N = spById(id); if (!N) return null;
  const sig = spSig(N); let r = SP_CACHE.get(sig);
  if (!r) { r = { sig, ...spBuild(N) }; SP_CACHE.set(sig, r); if (SP_CACHE.size > 12) SP_CACHE.delete(SP_CACHE.keys().next().value); }
  return r;
}

/* ---------- a level as the record and this browser keep it, and back ----------
   A leg kept is the builder's own leg (pbSlipOf: the game, its clubs, date and tip, the kind, the side, the line,
   DraftKings' price and the other side's, the read's time, its betslip id), its name and words, the model's chance (4
   places), DraftKings' fair chance and whether it is estimated, and its marks (thin, market). A level is {id, label,
   min, max, price, legs, p, fair, fair_est, dec} or {id, label, min, max, price, why} */
function spLegOut(l) { const f = legFair(l);
  return { ...pbSlipOf(l), name: String(l.name || ''), label: String(l.label || ''), p: spR(l.p, 1e4), fair: f ? spR(f.p, 1e4) : null, fair_est: !!(f && f.est), thin: !!l.thin, market: !!l.market }; }
function spTierOut(t) {
  const head = { id: t.id, label: t.label, min: t.min, max: t.max, price: t.price };
  if (!t || !t.legs) return { ...head, why: t.why };
  return { ...head, legs: t.legs.map(spLegOut), p: spR(t.corr, 1e4), fair: t.fair && t.fair.p != null ? spR(t.fair.p, 1e4) : null, fair_est: !!(t.fair && t.fair.est), dec: spR(t.dec, 1e3) };
}
/* the pool as the record keeps it, for its guard (tools/suggest_check.js) to work every level out again on its own:
   each leg [its key, DraftKings' price, the model's chance], and each game's side and total together [the two legs'
   places, their joint chance and their price], with the counts the rules left out. Chances and prices are kept whole,
   as the search ranked them (a number written to JSON reads back as itself): rounded, two parlays the search told apart
   by less than the rounding would read as level to the guard, which would then rank them by the tie's rules */
function spPoolOut(s) {
  const legs = s.pool.legs, ix = new Map(legs.map((l, i) => [l.sk, i])), pairs = [];
  for (const g of s.G) for (const o of g.opts) if (o.legs.length === 2) { const [a, b] = [ix.get(o.legs[0].sk), ix.get(o.legs[1].sk)].sort((x, y) => x - y); pairs.push([a, b, o.p, o.d]); }
  pairs.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  return { legs: legs.map(l => [l.sk, l.price, l.p]), pairs, band: s.pool.band, far: s.pool.far, noId: s.pool.noId };
}
/* a pool (live, or as the record keeps it) of a night DraftKings had posted no game line for: no leg, and none left out
   by a rule. A set taken then is no set: the job takes none, and the page builds its own from the lock */
const spNoLines = P => !!P && Array.isArray(P.legs) && !P.legs.length && !P.band && !P.far && !P.noId;
/* a night's set as the record takes it (tools/suggest_ledger.js adds the time taken) */
function spEntry(id) {
  const N = spById(id), s = N && spSet(id); if (!s) return null;
  return { season: S.season, date: N.date, nid: N.id, games: N.games.map(g => ({ gid: g.id, away: g.away, home: g.home, tip: g.tip, type: g.type })), tip: N.tip, last: N.last,
    lock: spMin(spLockAt(N)), generated: S.generated, pool: spPoolOut(s), tiers: s.tiers.map(t => JSON.parse(JSON.stringify(spTierOut(t)))) };
}

/* ---------- the record (data/suggest_ledger.json, tools/suggest_ledger.js) ----------
